<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Boundaries */
      .node-box { fill: #fafafa; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .space-label { font-size: 14px; font-weight: 600; fill: #546e7a; text-anchor: middle; }
      
      /* Components */
      .ebpf-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .buffer-shape { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.5; }
      .agent-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 6; }
      .output-box { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 4; }
      
      /* Arrows */
      .arrow-line { fill: none; stroke: #37474f; stroke-width: 2.0; marker-end: url(#arrow-head); }
      .arrow-label { font-size: 11px; font-weight: 600; text-anchor: middle; }
      
      /* Text */
      .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .comp-title { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .comp-text { font-size: 11px; text-anchor: middle; }
      .annotation { font-size: 12px; font-weight: 600; fill: #455a64; font-style: italic; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="400" y="40" class="title">Hubble Observability: Kernel-Level Visibility</text>

  <!-- Node Container -->
  <rect x="50" y="70" width="700" height="380" class="node-box" />
  <text x="400" y="95" class="comp-title" fill="#90a4ae">Kubernetes Node</text>

  <!-- Vertical Divider -->
  <line x1="400" y1="110" x2="400" y2="430" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4" />

  <!-- LEFT COLUMN: KERNEL SPACE -->
  <text x="225" y="125" class="space-label">Kernel Space</text>
  
  <rect x="100" y="140" width="250" height="110" class="ebpf-box" />
  <text x="225" y="165" class="comp-title" fill="#1b5e20">eBPF Datapath</text>
  <text x="225" y="190" class="comp-text" fill="#1b5e20">• Policy verdicts</text>
  <text x="225" y="205" class="comp-text" fill="#1b5e20">• Latency measurement</text>
  <text x="225" y="220" class="comp-text" fill="#1b5e20">• L4/L7 metadata / Drop reason</text>

  <!-- Internal Processing Arrow -->
  <path d="M150 180 Q100 200 150 220" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-head)" opacity="0.5"/>
  <text x="135" y="175" class="comp-text" fill="#2e7d32" font-weight="bold">Packet Processing</text>

  <!-- Ring Buffer -->
  <path d="M150 320 c0 -10 150 -10 150 0 v20 c0 10 -150 10 -150 0 z" class="buffer-shape" />
  <ellipse cx="225" cy="320" rx="75" ry="5" class="buffer-shape" />
  <text x="225" y="350" class="comp-title" fill="#1b5e20">Ring Buffer</text>

  <!-- Datapath to Buffer Arrow -->
  <line x1="225" y1="250" x2="225" y2="305" class="arrow-line" />
  <text x="225" y="280" class="arrow-label">Async flow events</text>

  <!-- RIGHT COLUMN: USER SPACE -->
  <text x="575" y="125" class="space-label">User Space</text>

  <rect x="450" y="160" width="250" height="120" class="agent-box" />
  <text x="575" y="185" class="comp-title" fill="#0d47a1">Hubble Agent</text>
  <text x="575" y="210" class="comp-text" fill="#0d47a1">• Enriches with pod / namespace</text>
  <text x="575" y="225" class="comp-text" fill="#0d47a1">• Aggregates events</text>
  <text x="575" y="240" class="comp-text" fill="#0d47a1">• Provides gRPC API</text>

  <!-- Buffer to Agent Arrow -->
  <path d="M305 325 Q450 325 450 250" fill="none" stroke="#37474f" stroke-width="2.0" marker-end="url(#arrow-head)" />
  <text x="440" y="315" class="arrow-label" style="text-anchor: end;">Reads flow metadata</text>

  <!-- OUTPUT CONSUMERS -->
  <rect x="100" y="480" width="180" height="50" class="output-box" />
  <text x="190" y="510" class="comp-title" fill="#4a148c">Hubble CLI</text>

  <rect x="310" y="480" width="180" height="50" class="output-box" />
  <text x="400" y="510" class="comp-title" fill="#4a148c">Hubble UI (Service Map)</text>

  <rect x="520" y="480" width="180" height="50" class="output-box" />
  <text x="610" y="510" class="comp-title" fill="#4a148c">Metrics / Prometheus</text>

  <!-- Agent to Consumers -->
  <path d="M575 280 L575 420 Q575 450 520 450 L200 450 Q190 450 190 480" class="arrow-line" />
  <path d="M400 450 L400 480" class="arrow-line" />
  <path d="M600 450 L600 480" class="arrow-line" />

  <!-- ANNOTATIONS -->
  <text x="50" y="550" class="annotation" style="text-anchor: start;">"No packet payload copied"</text>
  <text x="750" y="550" class="annotation" style="text-anchor: end;">"No impact on datapath latency"</text>
  <text x="400" y="580" class="annotation" style="text-anchor: middle;">"Observability without sidecars"</text>

</svg>
