<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .cluster-bg { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      .node-bg { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.5; rx: 6; }
      
      .pod-active { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1.5; rx: 4; }
      .pod-failed { fill: #ffebee; stroke: #e57373; stroke-width: 1.5; rx: 4; stroke-dasharray: 2 2; }
      .pod-remote { fill: #e8f5e9; stroke: #66bb6a; stroke-width: 1.5; rx: 4; }
      
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
      .arrow-fail { stroke: #e57373; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-fail); }
      .arrow-success { stroke: #4caf50; stroke-width: 2.5; marker-end: url(#arrow-success); }
      
      .step-circle { fill: #263238; stroke: none; }
      .step-text { fill: #ffffff; font-weight: bold; font-size: 10px; text-anchor: middle; alignment-baseline: middle; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-fail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e57373" />
    </marker>
    <marker id="arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" font-size="18" font-weight="bold" text-anchor="middle">Cluster Mesh – Global Service Traffic Flow</text>

  <!-- Cluster A -->
  <rect x="50" y="80" width="300" height="350" class="cluster-bg" />
  <text x="200" y="110" font-size="14" font-weight="bold" fill="#546e7a" text-anchor="middle">Cluster A</text>

  <!-- Node A -->
  <rect x="80" y="130" width="240" height="280" class="node-bg" />
  <text x="110" y="155" font-size="11" fill="#90a4ae">NODE 1</text>

  <!-- Frontend Pod -->
  <rect x="140" y="170" width="120" height="50" class="pod-active" />
  <text x="200" y="195" font-size="12" font-weight="bold" text-anchor="middle">Frontend Pod</text>
  <text x="200" y="210" font-size="10" fill="#1565c0" text-anchor="middle">Source</text>

  <!-- Local Failed Pod -->
  <rect x="140" y="300" width="120" height="50" class="pod-failed" />
  <text x="200" y="325" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">Backend Pod</text>
  <text x="200" y="340" font-size="10" fill="#c62828" text-anchor="middle">Local (Failed)</text>
  <text x="200" y="300" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">✕</text>


  <!-- Cluster B -->
  <rect x="450" y="80" width="300" height="350" class="cluster-bg" />
  <text x="600" y="110" font-size="14" font-weight="bold" fill="#546e7a" text-anchor="middle">Cluster B</text>

  <!-- Node B -->
  <rect x="480" y="130" width="240" height="280" class="node-bg" />
  <text x="510" y="155" font-size="11" fill="#90a4ae">NODE 2</text>

  <!-- Remote Healthy Pod -->
  <rect x="540" y="300" width="120" height="50" class="pod-remote" />
  <text x="600" y="325" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">Backend Pod</text>
  <text x="600" y="340" font-size="10" fill="#2e7d32" text-anchor="middle">Remote (Active)</text>


  <!-- FLOW STEPS -->
  
  <!-- Step 1: Request -->
  <circle cx="200" cy="240" r="10" class="step-circle" />
  <text x="200" y="244" class="step-text">1</text>
  <text x="220" y="245" font-size="11" fill="#37474f">Request</text>

  <!-- Step 2 & 3: Failed Local Check -->
  <line x1="200" y1="220" x2="200" y2="300" class="arrow-fail" />
  
  <circle cx="180" cy="270" r="10" class="step-circle" fill="#c62828" />
  <text x="180" y="274" class="step-text">2</text>
  <text x="160" y="275" font-size="10" fill="#c62828" text-anchor="end">Local Pref.</text>

  <circle cx="220" cy="270" r="10" class="step-circle" fill="#c62828" />
  <text x="220" y="274" class="step-text">3</text>
  <text x="240" y="275" font-size="10" fill="#c62828" text-anchor="start">Check Fail</text>


  <!-- Step 4 & 5: Failover Route -->
  <path d="M260 195 L540 300" stroke="none" fill="none" /> <!-- Helper -->
  
  <!-- Actual curve or straight line for tunnel routing -->
  <!-- We use straight line due to 'Straight arrows only' requirement, but angled across clusters -->
  <line x1="260" y1="195" x2="540" y2="300" class="arrow-success" />
  
  <!-- Annotations on path -->
  <circle cx="400" cy="247" r="10" class="step-circle" fill="#4caf50" />
  <text x="400" y="251" class="step-text">4</text>
  <text x="400" y="230" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">Global Failover</text>
  
  <circle cx="480" cy="277" r="10" class="step-circle" fill="#4caf50" />
  <text x="480" y="281" class="step-text">5</text>
  <text x="500" y="290" font-size="10" fill="#2e7d32" text-anchor="start">Tunnel</text>

  <!-- Bottom Note -->
  <text x="400" y="460" font-size="12" font-style="italic" fill="#546e7a" text-anchor="middle">
    Note: Load balancing decision happens on source node via eBPF
  </text>

</svg>
