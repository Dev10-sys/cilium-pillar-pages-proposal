<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      .cluster-box { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      .node-box { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.5; rx: 6; }
      
      .agent-box { fill: #e8f5e9; stroke: #66bb6a; stroke-width: 1.5; rx: 4; }
      .pod-box { fill: #e3f2fd; stroke: #42a5f5; stroke-width: 1.5; rx: 4; }
      
      .sync-region { fill: #fff3e0; stroke: #ffe0b2; stroke-width: 1.5; rx: 16; }
      
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
      .arrow-dashed { stroke: #fb8c00; stroke-width: 1.5; stroke-dasharray: 6 3; marker-end: url(#arrow-head-orange); }
      .arrow-tunnel { stroke: #1976d2; stroke-width: 3.0; marker-end: url(#arrow-head-blue); }
      
      .label-title { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-subtitle { font-size: 14px; font-weight: 600; fill: #546e7a; text-anchor: middle; }
      .label { font-size: 12px; font-weight: 400; text-anchor: middle; }
      .label-bold { font-size: 12px; font-weight: 600; text-anchor: middle; }
      .highlight { font-size: 11px; fill: #d32f2f; font-weight: 600; text-anchor: end; }
    </style>
    
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb8c00" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="label-title">Cilium Cluster Mesh Architecture</text>

  <!-- Cluster A -->
  <rect x="50" y="70" width="300" height="300" class="cluster-box" />
  <text x="200" y="100" class="label-subtitle">Cluster A</text>

  <!-- Node A -->
  <rect x="80" y="130" width="240" height="200" class="node-box" />
  <text x="110" y="155" class="label" fill="#90a4ae" style="font-size: 11px;">NODE 1</text>
  
  <rect x="140" y="170" width="120" height="40" class="agent-box" />
  <text x="200" y="195" class="label-bold">Cilium Agent</text>
  
  <rect x="140" y="250" width="120" height="40" class="pod-box" />
  <text x="200" y="275" class="label">Pod A (Source)</text>


  <!-- Cluster B -->
  <rect x="450" y="70" width="300" height="300" class="cluster-box" />
  <text x="600" y="100" class="label-subtitle">Cluster B</text>

  <!-- Node B -->
  <rect x="480" y="130" width="240" height="200" class="node-box" />
  <text x="510" y="155" class="label" fill="#90a4ae" style="font-size: 11px;">NODE 2</text>
  
  <rect x="540" y="170" width="120" height="40" class="agent-box" />
  <text x="600" y="195" class="label-bold">Cilium Agent</text>
  
  <rect x="540" y="250" width="120" height="40" class="pod-box" />
  <text x="600" y="275" class="label">Pod B (Dest)</text>


  <!-- SYNC PLANE -->
  <rect x="280" y="180" width="240" height="30" class="sync-region" />
  <text x="400" y="200" class="label-bold" fill="#e65100">Identity &amp; Service Sync</text>
  
  <!-- Dashed Arrows (Control Plane) -->
  <line x1="260" y1="190" x2="280" y2="190" class="arrow-dashed" />
  <line x1="540" y1="190" x2="520" y2="190" class="arrow-dashed" />


  <!-- TUNNEL (DATA PLANE) -->
  <line x1="260" y1="270" x2="540" y2="270" class="arrow-tunnel" />
  
  <!-- Tunnel Label -->
  <rect x="300" y="260" width="200" height="20" fill="white" opacity="0.95" rx="4" />
  <text x="400" y="275" class="label-bold" fill="#1565c0">Direct Tunnel (VXLAN)</text>

  <!-- Annotations -->
  <g transform="translate(0, 400)">
    <text x="750" y="0" class="highlight">✓ No Shared etcd</text>
    <text x="750" y="20" class="highlight">✓ No Central Gateway</text>
    <text x="750" y="40" class="highlight">✓ High Availability</text>
  </g>

</svg>
