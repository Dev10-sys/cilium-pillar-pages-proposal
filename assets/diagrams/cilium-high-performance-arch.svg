<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg { fill: #ffffff; }
      
      /* Panels */
      .panel-border { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; rx: 8; }
      .node-box { fill: #fafafa; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      
      /* Components */
      .iptables-box { fill: #ffebee; stroke: #c62828; stroke-width: 1; rx: 2; }
      .ebpf-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 4; }
      .xdp-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.5; rx: 4; }
      .info-box { fill: #ffffff; stroke: #b0bec5; stroke-width: 1; rx: 4; }
      
      /* Arrows */
      .arrow-std { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      .arrow-fast { stroke: #2e7d32; stroke-width: 2.5; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-slow { stroke: #c62828; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-red); }
      
      /* Text */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-panel { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    </style>
    
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Cilium High-Performance Datapath: XDP, Maglev &amp; DSR</text>

  <!-- LEFT PANEL: TRADITIONAL -->
  <rect x="50" y="80" width="440" height="420" class="panel-border" />
  <text x="270" y="110" class="title-panel" fill="#c62828">Traditional Kubernetes Networking</text>
  
  <rect x="80" y="130" width="380" height="300" class="node-box" />
  <text x="100" y="150" class="label-small">Linux Node</text>

  <rect x="180" y="160" width="180" height="30" class="info-box" />
  <text x="270" y="180" class="label-bold">NIC</text>

  <rect x="180" y="200" width="180" height="80" fill="#f5f5f5" stroke="#9e9e9e" rx="4" />
  <text x="270" y="220" class="label-reg">iptables chains (O(N))</text>
  <text x="270" y="240" class="label-reg">conntrack table</text>
  <text x="270" y="260" class="label-reg">Linux Netfilter</text>

  <rect x="180" y="290" width="180" height="30" class="info-box" />
  <text x="270" y="310" class="label-bold">kube-proxy (Userspace)</text>

  <path d="M270 125 L270 160" class="arrow-slow" />
  <path d="M270 190 L270 200" class="arrow-slow" />
  <path d="M270 280 L270 290" class="arrow-slow" />
  <text x="175" y="240" class="label-small" transform="rotate(-90 175 240)">Slow Path</text>

  <text x="270" y="450" class="label-reg" style="fill:#c62828; font-weight:600;">O(N) traversal | conntrack contention | context switching</text>


  <!-- RIGHT PANEL: CILIUM FAST PATH -->
  <rect x="510" y="80" width="440" height="420" class="panel-border" />
  <text x="730" y="110" class="title-panel" fill="#2e7d32">Cilium eBPF Datapath</text>
  
  <rect x="540" y="130" width="380" height="300" class="node-box" />
  <text x="560" y="150" class="label-small">Linux Node</text>

  <rect x="640" y="160" width="180" height="30" class="info-box" />
  <text x="730" y="180" class="label-bold">NIC</text>

  <rect x="640" y="200" width="180" height="40" class="xdp-box" />
  <text x="730" y="225" class="label-bold" fill="#1b5e20">XDP Hook</text>

  <rect x="640" y="250" width="180" height="60" class="ebpf-box" />
  <text x="730" y="275" class="label-bold" fill="#0d47a1">eBPF Maps (Hash Tables)</text>
  <text x="730" y="295" class="label-small" style="fill:#0d47a1;">O(1) Lookup</text>

  <path d="M730 125 L730 160" class="arrow-fast" />
  <path d="M730 190 L730 200" class="arrow-fast" />
  <path x="730" y="240" d="M730 240 L730 250" class="arrow-fast" />
  <text x="635" y="240" class="label-small" transform="rotate(-90 635 240)" style="fill:#2e7d32;">Fast Path</text>

  <text x="730" y="450" class="label-reg" style="fill:#1b5e20; font-weight:600;">Constant-time | Deterministic | Bypass Netfilter</text>


  <!-- MAGLEV Load Balancing -->
  <rect x="300" y="520" width="400" height="100" class="info-box" stroke="#2e7d32" stroke-width="1.5" />
  <text x="500" y="545" class="label-bold" fill="#1b5e20">Maglev Consistent Hashing</text>
  <text x="320" y="575" class="label-reg">Flow Hash →</text>
  <rect x="400" y="560" width="150" height="40" fill="#e8f5e9" stroke="#2e7d32" rx="4" />
  <text x="475" y="585" class="label-small" font-weight="bold">Lookup Table</text>
  <text x="560" y="575" class="label-reg">→ Backend Pods</text>
  <text x="500" y="610" class="label-small">Minimal disruption on scale | Stateless | Kernel-native</text>


  <!-- Direct Server Return (DSR) -->
  <rect x="50" y="640" width="440" height="150" class="info-box" />
  <text x="270" y="665" class="label-bold">Direct Server Return (DSR)</text>
  <text x="100" y="700" class="label-small">Client → LB Node → Pod</text>
  <path d="M100 720 L440 720" class="arrow-green" />
  <text x="100" y="740" class="label-small">Pod → Client (Direct)</text>
  <path d="M440 760 L100 760" class="arrow-green" marker-end="url(#arrow-head-green)" />
  <text x="270" y="785" class="label-small" font-weight="bold" fill="#1b5e20">No Reverse NAT | Ingress Node not Bottleneck</text>


  <!-- CONNTRACK BYPASS & SAFETY -->
  <rect x="510" y="640" width="210" height="150" class="info-box" />
  <text x="615" y="665" class="label-bold">Selective Bypass</text>
  <text x="615" y="690" class="label-reg">• UDP workloads</text>
  <text x="615" y="705" class="label-reg">• DSR traffic</text>
  <text x="615" y="720" class="label-reg">• Stateless flows</text>
  <text x="615" y="750" class="label-small" font-style="italic">Security preserved via eBPF policy</text>

  <rect x="740" y="640" width="210" height="150" class="info-box" />
  <text x="845" y="665" class="label-bold">Kernel Safety</text>
  <text x="845" y="690" class="label-reg">• eBPF Verifier</text>
  <text x="845" y="705" class="label-reg">• Memory Safe</text>
  <text x="845" y="720" class="label-reg">• Graceful Fallback</text>
  <text x="845" y="750" class="label-small" font-style="italic">Bounded execution | No crashes</text>


  <!-- OBSERVABILITY -->
  <text x="500" y="860" class="label-bold" style="font-size: 16px;">Observability Preserved via Hubble Ring Buffer (Zero Copy)</text>

</svg>
