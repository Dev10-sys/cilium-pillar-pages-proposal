<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .bg { fill: #ffffff; }
      
      /* Standardized Boxes */
      .border-thin { fill: #ffffff; stroke: #37474f; stroke-width: 1; rx: 0; }
      .kernel-bg { fill: #f5f5f5; stroke: #37474f; stroke-width: 1.5; rx: 0; }
      .intent-bg { fill: #ffffff; stroke: #37474f; stroke-width: 1; rx: 0; }
      .identity-bg { fill: #fff9c4; stroke: #fbc02d; stroke-width: 1.5; rx: 0; }
      .ebpf-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 0; }
      .pod-box { fill: #ffffff; stroke: #37474f; stroke-width: 1; rx: 0; }
      
      /* Decision Diamond */
      .diamond { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }
      
      /* Arrows */
      .arrow-green { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-red { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#arrow-head-red); }
      .arrow-std { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      .arrow-dash { stroke: #37474f; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; marker-end: url(#arrow-head-dark); }
      
      /* Labels */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-panel { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #455a64; text-anchor: middle; }
      .verdict-allow { fill: #2e7d32; font-size: 12px; font-weight: 600; }
      .verdict-deny { fill: #c62828; font-size: 12px; font-weight: 600; }
    </style>
    
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  <text x="500" y="40" class="title-main">Cilium Network Security: Identity-Based Policy Enforcement</text>

  <!-- LEFT PANEL: KUBERNETES INTENT -->
  <rect x="50" y="80" width="280" height="180" class="intent-bg" />
  <text x="190" y="105" class="title-panel">Kubernetes Control Plane</text>
  <text x="70" y="130" class="label-bold" style="text-anchor: start;">Pod Labels:</text>
  <text x="80" y="150" class="mono" style="text-anchor: start;">app=frontend</text>
  <text x="80" y="165" class="mono" style="text-anchor: start;">role=backend</text>
  <text x="70" y="195" class="label-bold" style="text-anchor: start;">NetworkPolicy:</text>
  <text x="80" y="215" class="mono" style="text-anchor: start;">allow frontend → backend</text>
  <text x="80" y="230" class="mono" style="text-anchor: start;">TCP Port 80</text>

  <!-- IDENTITY MAPPING (CENTER TOP) -->
  <rect x="380" y="80" width="570" height="100" class="identity-bg" />
  <text x="665" y="105" class="title-panel" fill="#f57f17">Identity Mapping</text>
  <text x="400" y="135" class="mono" style="text-anchor: start;">[app=frontend] → Identity 1001</text>
  <text x="400" y="155" class="mono" style="text-anchor: start;">[role=backend]  → Identity 2001</text>
  <text x="665" y="170" class="label-small" style="fill:#f57f17; font-weight:600;">"Identity is stable across Pod restarts and IP changes"</text>

  <path d="M330 140 L380 140" class="arrow-std" />

  <!-- KERNEL ENFORCEMENT (CENTER) -->
  <rect x="50" y="300" width="900" height="420" class="kernel-bg" />
  <text x="500" y="325" class="title-panel">Linux Kernel — eBPF Datapath</text>

  <!-- Logic Blocks -->
  <rect x="100" y="360" width="180" height="40" class="ebpf-box" />
  <text x="190" y="385" class="label-bold" fill="#0d47a1">Packet Arrives</text>

  <rect x="320" y="360" width="220" height="60" class="ebpf-box" />
  <text x="430" y="385" class="label-bold" fill="#0d47a1">Identity Lookup</text>
  <text x="430" y="405" class="label-small" style="fill:#0d47a1;">Source ID + Destination ID</text>

  <!-- Policy Map Detail -->
  <rect x="680" y="360" width="220" height="80" class="ebpf-box" stroke-dasharray="2 2" />
  <text x="790" y="385" class="label-bold" fill="#0d47a1">eBPF Policy Map</text>
  <text x="695" y="405" class="mono" style="text-anchor: start;">Key: SrcID + DstID + L4</text>
  <text x="695" y="425" class="mono" style="text-anchor: start;">Value: ALLOW / DENY</text>
  <text x="790" y="455" class="label-small" fill="#0d47a1" font-weight="600">O(1) lookup — constant time</text>

  <!-- Decision -->
  <polygon points="500,480 580,530 500,580 420,530" class="diamond" />
  <text x="500" y="535" class="label-bold" fill="#0d47a1">Policy Lookup</text>

  <path d="M190 400 L190 530 L420 530" class="arrow-std" />
  <path d="M430 420 L430 480" class="arrow-std" />
  <path d="M680 400 L585 510" class="arrow-dash" />

  <!-- Branches -->
  <path d="M580 530 L800 530 L800 600" class="arrow-green" />
  <text x="750" y="520" class="verdict-allow" style="text-anchor: start;">ALLOW → Forward</text>
  
  <path d="M420 530 L200 530 L200 600" class="arrow-red" />
  <text x="250" y="520" class="verdict-deny" style="text-anchor: end;">DENY → DROP</text>

  <!-- PACKET FLOW VISUAL -->
  <rect x="120" y="620" width="160" height="60" class="pod-box" />
  <text x="200" y="645" class="label-bold">Frontend Pod</text>
  <text x="200" y="665" class="label-small">Identity 1001</text>

  <rect x="420" y="620" width="160" height="60" class="pod-box" />
  <text x="500" y="645" class="label-bold">Backend Pod</text>
  <text x="500" y="665" class="label-small">Identity 2001</text>

  <rect x="720" y="620" width="160" height="60" class="pod-box" stroke="#c62828" />
  <text x="800" y="645" class="label-bold" fill="#c62828">Database Pod</text>
  <text x="800" y="665" class="label-small">Illegal Destination</text>

  <path d="M200 680 L200 710 L500 710 L500 680" class="arrow-green" />
  <text x="350" y="705" class="label-reg" fill="#2e7d32" font-weight="600">Frontend (1001) → Backend (2001): OK</text>

  <path d="M120 650 L30 650 L30 780 L800 780 L800 680" class="arrow-red" />
  <text x="415" y="775" class="label-reg" fill="#c62828" font-weight="600">Frontend (1001) → Database: DROP (No Policy)</text>

  <!-- KEY PROPERTIES -->
  <rect x="50" y="800" width="160" height="60" class="intent-bg" />
  <text x="130" y="825" class="label-bold">Identity > IP</text>
  <text x="130" y="845" class="label-small">Zero Trust Friendly</text>

  <rect x="230" y="800" width="160" height="60" class="intent-bg" />
  <text x="310" y="825" class="label-bold">No iptables</text>
  <text x="310" y="845" class="label-small">Scale-safe O(1)</text>

  <rect x="410" y="800" width="160" height="60" class="intent-bg" />
  <text x="490" y="825" class="label-bold">Kernel-Level</text>
  <text x="490" y="845" class="label-small">Pre-App Enforcement</text>

  <rect x="590" y="800" width="160" height="60" class="intent-bg" />
  <text x="670" y="825" class="label-bold">Always On</text>
  <text x="670" y="845" class="label-small">Works during Restart</text>

  <rect x="770" y="800" width="180" height="60" class="intent-bg" />
  <text x="860" y="825" class="label-bold">Per-Packet</text>
  <text x="860" y="845" class="label-small">Total Compliance</text>

</svg>
