<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .container-bg { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      
      .label-box { fill: #fff3e0; stroke: #ffb74d; stroke-width: 1.5; rx: 4; }
      .identity-box { fill: #e3f2fd; stroke: #64b5f6; stroke-width: 2.0; rx: 20; }
      .pod-box { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.5; rx: 4; }
      .policy-box { fill: #e8f5e9; stroke: #66bb6a; stroke-width: 1.5; rx: 4; }
      
      /* Typography */
      .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .subtitle { font-size: 12px; font-weight: 600; fill: #546e7a; text-anchor: start; }
      .label { font-size: 12px; font-weight: 400; text-anchor: middle; }
      .label-bold { font-size: 12px; font-weight: 600; text-anchor: middle; }
      .code { font-family: monospace; font-size: 11px; }
      
      /* Connections */
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
      .line-dashed { stroke: #90a4ae; stroke-width: 1.5; stroke-dasharray: 4 2; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="300" y="40" class="title">Cilium Identity-Based Security Model</text>

  <!-- 1. Kubernetes Labels -->
  <text x="50" y="80" class="subtitle">1. KUBERNETES LABELS</text>
  <rect x="200" y="70" width="200" height="60" class="label-box" />
  <text x="300" y="95" class="code">app=frontend</text>
  <text x="300" y="115" class="code">env=prod</text>

  <line x1="300" y1="130" x2="300" y2="170" class="arrow" />

  <!-- 2. Identity Mapping -->
  <text x="50" y="200" class="subtitle">2. IDENTITY MAPPING</text>
  <rect x="220" y="170" width="160" height="60" class="identity-box" />
  <text x="300" y="195" class="label-bold">Security Identity</text>
  <text x="300" y="215" class="label-bold" style="font-size: 14px; fill: #1565c0;">ID: 105</text>

  <!-- Connection to Pods -->
  <line x1="300" y1="230" x2="160" y2="280" class="line-dashed" />
  <line x1="300" y1="230" x2="440" y2="280" class="line-dashed" />

  <!-- 3. Workloads (Pods) -->
  <text x="50" y="300" class="subtitle">3. WORKLOADS (EPHEMERAL)</text>
  
  <rect x="100" y="280" width="120" height="50" class="pod-box" />
  <text x="160" y="305" class="label-bold">Pod A</text>
  <text x="160" y="320" class="label" style="font-size: 10px;">IP: 10.0.1.5</text>

  <rect x="380" y="280" width="120" height="50" class="pod-box" />
  <text x="440" y="305" class="label-bold">Pod B</text>
  <text x="440" y="320" class="label" style="font-size: 10px;">IP: 10.0.2.9</text>


  <!-- 4. Policy Rule -->
  <text x="50" y="400" class="subtitle">4. POLICY ENFORCEMENT</text>
  
  <rect x="150" y="380" width="300" height="60" class="policy-box" />
  <text x="300" y="405" class="label-bold">Network Policy Rule</text>
  <text x="300" y="425" class="code" style="font-weight: bold; fill: #2e7d32;">Allow: ID(105) → ID(210)</text>

  <!-- Annotation -->
  <rect x="350" y="460" width="220" height="30" fill="#fff" stroke="#ff9800" stroke-width="1" rx="4" />
  <text x="460" y="480" class="label" style="font-size: 11px; fill: #ef6c00;">Policies scale with identities, not Pods</text>

</svg>
