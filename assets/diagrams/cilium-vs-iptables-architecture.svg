<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .node-bg { fill: #f9fafb; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      
      /* Component Colors */
      .pod-box { fill: #e3f2fd; stroke: #42a5f5; stroke-width: 1.5; rx: 6; }
      .ebpf-box { fill: #e8f5e9; stroke: #66bb6a; stroke-width: 1.5; rx: 6; }
      .rule-box { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.5; }
      
      /* Typography */
      .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .col-title { font-size: 14px; font-weight: 600; fill: #546e7a; text-anchor: middle; }
      .label { font-size: 13px; font-weight: 400; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .annotation { font-size: 12px; fill: #d32f2f; text-anchor: start; }
      .annotation-green { font-size: 12px; fill: #2e7d32; text-anchor: middle; }

      /* Connections */
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="title">Standard Kubernetes Networking vs Cilium eBPF Networking</text>

  <!-- Left Column: Standard K8s -->
  <g transform="translate(0, 0)">
    <text x="200" y="80" class="col-title">Standard Kubernetes (kube-proxy + iptables)</text>
    
    <!-- Node Boundary -->
    <rect x="50" y="100" width="300" height="450" class="node-bg" />
    <text x="80" y="125" class="label" fill="#90a4ae" style="font-size: 11px;">NODE</text>

    <!-- Client Pod -->
    <rect x="140" y="140" width="120" height="50" class="pod-box" />
    <text x="200" y="170" class="label-bold">Client Pod</text>

    <!-- Arrow Down -->
    <line x1="200" y1="190" x2="200" y2="230" class="arrow" />

    <!-- Rule Stack -->
    <g transform="translate(140, 230)">
      <rect x="0" y="0" width="120" height="24" class="rule-box" />
      <text x="60" y="17" class="label">Rule 1</text>
      
      <rect x="0" y="24" width="120" height="24" class="rule-box" />
      <text x="60" y="41" class="label">Rule 2</text>
      
      <rect x="0" y="48" width="120" height="24" class="rule-box" />
      <text x="60" y="65" class="label">Rule 3</text>
      
      <rect x="0" y="72" width="120" height="24" class="rule-box" border-bottom="none" />
      <text x="60" y="89" class="label">...</text>
      
      <rect x="0" y="96" width="120" height="24" class="rule-box" />
      <text x="60" y="113" class="label">Rule N</text>
    </g>

    <!-- Annotation -->
    <text x="270" y="290" class="annotation">O(N) traversal</text>

    <!-- Arrow Down -->
    <line x1="200" y1="350" x2="200" y2="400" class="arrow" />

    <!-- Dest Pod -->
    <rect x="140" y="400" width="120" height="50" class="pod-box" />
    <text x="200" y="430" class="label-bold">Dest Pod</text>
  </g>

  <!-- Right Column: Cilium -->
  <g transform="translate(400, 0)">
    <text x="200" y="80" class="col-title">Cilium Networking (eBPF)</text>
    
    <!-- Node Boundary -->
    <rect x="50" y="100" width="300" height="450" class="node-bg" />
    <text x="80" y="125" class="label" fill="#90a4ae" style="font-size: 11px;">NODE</text>

    <!-- Client Pod -->
    <rect x="140" y="140" width="120" height="50" class="pod-box" />
    <text x="200" y="170" class="label-bold">Client Pod</text>

    <!-- Arrow Down -->
    <line x1="200" y1="190" x2="200" y2="260" class="arrow" />

    <!-- eBPF Map -->
    <rect x="140" y="260" width="120" height="60" class="ebpf-box" />
    <text x="200" y="285" class="label-bold">eBPF Map</text>
    <text x="200" y="305" class="label" style="font-size: 11px;">(Hash Table)</text>

    <!-- Annotation -->
    <text x="200" y="340" class="annotation-green">O(1) Lookup</text>

    <!-- Arrow Down -->
    <line x1="200" y1="320" x2="200" y2="400" class="arrow" />

    <!-- Dest Pod -->
    <rect x="140" y="400" width="120" height="50" class="pod-box" />
    <text x="200" y="430" class="label-bold">Dest Pod</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="400" y1="100" x2="400" y2="550" stroke="#eceff1" stroke-width="2" />

</svg>
