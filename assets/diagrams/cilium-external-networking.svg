<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .phys-net { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      .k8s-cluster { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.5; rx: 8; }
      .node-bg { fill: #f9fafb; stroke: #cfd8dc; stroke-width: 1.5; rx: 6; }
      
      .router-box { fill: #ffffff; stroke: #37474f; stroke-width: 2.0; rx: 6; }
      .pod-box { fill: #e3f2fd; stroke: #42a5f5; stroke-width: 1.5; rx: 6; }
      .bgp-agent { fill: #fff3e0; stroke: #fb8c00; stroke-width: 1.5; rx: 6; }

      .arrow { stroke: #37474f; stroke-width: 2.5; marker-end: url(#arrow-head); }
      .arrow-dashed { stroke: #fb8c00; stroke-width: 1.5; stroke-dasharray: 6 3; marker-end: url(#arrow-head-orange); }
      
      .label { font-size: 13px; font-weight: 400; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 11px; fill: #546e7a; text-anchor: middle; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb8c00" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="300" y="40" font-size="18" font-weight="bold" text-anchor="middle">Cilium External Networking via BGP</text>

  <!-- External Client -->
  <rect x="240" y="60" width="120" height="40" fill="#eceff1" stroke="#546e7a" stroke-width="1.5" rx="4" />
  <text x="300" y="85" class="label-bold">External Client</text>

  <line x1="300" y1="100" x2="300" y2="130" class="arrow" />

  <!-- Physical Network Area -->
  <rect x="50" y="130" width="500" height="100" class="phys-net" />
  <text x="300" y="150" class="small" style="font-weight: bold;">DATA CENTER NETWORK</text>

  <!-- ToR Router -->
  <rect x="240" y="160" width="120" height="50" class="router-box" />
  <text x="300" y="190" class="label-bold">ToR Router</text>


  <!-- Kubernetes Cluster -->
  <rect x="50" y="260" width="500" height="300" class="k8s-cluster" />
  <text x="300" y="285" class="small" style="font-weight: bold;">KUBERNETES CLUSTER</text>

  <!-- Node 1 -->
  <rect x="80" y="300" width="200" height="200" class="node-bg" />
  <text x="180" y="325" class="label" fill="#90a4ae" style="font-size: 11px;">NODE 1</text>
  
  <rect x="120" y="340" width="120" height="40" class="bgp-agent" />
  <text x="180" y="365" class="label-bold">Cilium (BGP)</text>
  
  <rect x="120" y="420" width="120" height="40" class="pod-box" />
  <text x="180" y="445" class="label">Pod (10.0.1.5)</text>

  <!-- Node 2 -->
  <rect x="320" y="300" width="200" height="200" class="node-bg" />
  <text x="420" y="325" class="label" fill="#90a4ae" style="font-size: 11px;">NODE 2</text>
  
  <rect x="360" y="340" width="120" height="40" class="bgp-agent" />
  <text x="420" y="365" class="label-bold">Cilium (BGP)</text>
  
  <rect x="360" y="420" width="120" height="40" class="pod-box" />
  <text x="420" y="445" class="label">Pod (10.0.2.9)</text>


  <!-- CONNECTIONS -->

  <!-- BGP Peering (Dashed Orange) -->
  <line x1="180" y1="340" x2="260" y2="210" class="arrow-dashed" />
  <text x="210" y="260" class="small" fill="#e65100">Advertise routes</text>

  <line x1="420" y1="340" x2="340" y2="210" class="arrow-dashed" />
  
  <!-- Data Path (Solid Black) -->
  <line x1="280" y1="210" x2="180" y2="300" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow-head)" />
  <line x1="320" y1="210" x2="420" y2="300" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow-head)" />
  
  <text x="360" y="250" class="label-bold" style="font-size: 11px;">ECMP Routing</text>

  <!-- Annotations -->
  <rect x="80" y="520" width="440" height="30" fill="#fff" stroke="#cfd8dc" rx="4" />
  <text x="150" y="540" class="small" fill="#2e7d32">✓ Native L3 Integration</text>
  <text x="300" y="540" class="small" fill="#2e7d32">✓ No SNAT (Direct Pod IP)</text>
  <text x="450" y="540" class="small" fill="#2e7d32">✓ ECMP Balanced</text>

</svg>
