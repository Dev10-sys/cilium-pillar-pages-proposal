<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Regions */
      .region-box { fill: #fafafa; stroke: #cfd8dc; stroke-width: 1; rx: 8; }
      .node-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      
      /* Layers */
      .app-box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 4; }
      .ebpf-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .agent-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 6; }
      
      /* Arrows */
      .arrow-green { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-red { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#arrow-head-red); }
      .arrow-blue { stroke: #1565c0; stroke-width: 2; fill: none; marker-end: url(#arrow-head-blue); }
      .arrow-obs { stroke: #b0bec5; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; marker-end: url(#arrow-head-gray); }
      
      /* Mockup UI */
      .ui-panel { fill: #ffffff; stroke: #cfd8dc; rx: 4; }
      .flow-log-line { font-size: 10px; font-family: monospace; }
      .rect-allowed { fill: #e8f5e9; }
      .rect-denied { fill: #ffebee; }
      
      /* Text */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    </style>
    
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
    <marker id="arrow-head-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b0bec5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Kernel-Level Observability with Cilium &amp; Hubble</text>

  <!-- TOP SECTION: APPLICATION LAYER -->
  <rect x="100" y="80" width="550" height="120" class="region-box" />
  <text x="120" y="100" class="label-bold" style="text-anchor: start;">Application Pods</text>

  <rect x="130" y="130" width="120" height="40" class="app-box" />
  <text x="190" y="155" class="label-bold">Frontend Pod</text>

  <rect x="310" y="130" width="120" height="40" class="app-box" />
  <text x="370" y="155" class="label-bold">Backend Pod</text>

  <rect x="490" y="130" width="120" height="40" class="app-box" />
  <text x="550" y="155" class="label-bold">Database Pod</text>

  <!-- Traffic Arrows -->
  <path d="M250 150 L310 150" class="arrow-green" />
  <path d="M250 160 Q370 180 490 160" class="arrow-red" />
  <text x="370" y="195" class="label-reg" fill="#c62828">Blocked Request</text>

  <!-- MIDDLE SECTION: LINUX KERNEL -->
  <rect x="100" y="250" width="550" height="150" class="ebpf-box" />
  <text x="375" y="275" class="label-bold" fill="#1b5e20">Linux Kernel (Cilium eBPF Datapath)</text>
  
  <text x="375" y="300" class="label-reg" fill="#1b5e20">• eBPF Programs | Policy Enforcement | Identity Lookup</text>
  <text x="120" y="340" class="label-small" style="text-anchor: start; fill: #2e7d32;">Packet inspected here | Allow / Drop decision | Identity-based (labels)</text>

  <!-- Observability Tap -->
  <rect x="300" y="340" width="150" height="30" fill="#cfd8dc" stroke="#90a4ae" rx="15" />
  <text x="375" y="358" class="label-bold" style="font-size: 10px;">Hubble Ring Buffer</text>
  <path d="M375 315 L375 340" class="arrow-obs" />
  <text x="460" y="335" class="label-small">Async event export (no packet copy)</text>

  <!-- BOTTOM SECTION: USERSPACE -->
  <rect x="250" y="450" width="250" height="80" class="agent-box" />
  <text x="375" y="475" class="label-bold" fill="#0d47a1">Hubble Agent</text>
  <path d="M375 370 L375 450" class="arrow-blue" />
  
  <rect x="180" y="580" width="120" height="40" class="region-box" stroke="#1565c0" />
  <text x="240" y="605" class="label-bold" fill="#1565c0">Hubble CLI</text>
  
  <rect x="450" y="580" width="120" height="40" class="region-box" stroke="#1565c0" />
  <text x="510" y="605" class="label-bold" fill="#1565c0">Hubble UI</text>

  <path d="M300 500 L240 580" class="arrow-blue" />
  <path d="M450 500 L510 580" class="arrow-blue" />

  <!-- RIGHT SIDE: WHAT USER SEES -->
  <text x="700" y="100" class="label-bold">1. Flow Log</text>
  <rect x="700" y="115" width="250" height="100" class="ui-panel" />
  <rect x="705" y="125" width="240" height="15" class="rect-allowed" />
  <text x="710" y="136" class="flow-log-line">frontend → backend : ALLOWED</text>
  <rect x="705" y="145" width="240" height="15" class="rect-denied" />
  <text x="710" y="156" class="flow-log-line">frontend → database : DENIED (policy)</text>
  <text x="710" y="180" class="label-small">Trace: L3/L4 Endpoint Policy Enforcement</text>

  <text x="700" y="260" class="label-bold">2. Service Map</text>
  <rect x="700" y="275" width="250" height="150" class="ui-panel" />
  <circle cx="750" cy="320" r="15" fill="#e3f2fd" stroke="#1565c0" />
  <circle cx="850" cy="320" r="15" fill="#e3f2fd" stroke="#1565c0" />
  <circle cx="800" cy="380" r="15" fill="#e3f2fd" stroke="#1565c0" />
  <path d="M765 320 L835 320" class="arrow-green" marker-end="url(#arrow-head-green)" />
  <path d="M765 335 L790 370" class="arrow-red" marker-end="url(#arrow-head-red)" />
  <text x="750" y="345" class="label-small">Front</text>
  <text x="850" y="345" class="label-small">Back</text>
  <text x="800" y="405" class="label-small">DB</text>

  <!-- ANNOTATION BOX -->
  <rect x="700" y="480" width="250" height="150" class="region-box" />
  <text x="825" y="505" class="label-bold">Why This Observability Works</text>
  <text x="715" y="530" class="label-reg" style="text-anchor: start;">• No sidecars</text>
  <text x="715" y="550" class="label-reg" style="text-anchor: start;">• No tcpdump guessing</text>
  <text x="715" y="570" class="label-reg" style="text-anchor: start;">• Kernel-level truth</text>
  <text x="715" y="590" class="label-reg" style="text-anchor: start;">• Kubernetes-aware context</text>
  <text x="715" y="610" class="label-reg" style="text-anchor: start;">• Exact drop reason</text>

  <!-- TECHNICAL DETAILS (SMALL) -->
  <text x="110" y="385" class="label-small" style="text-anchor: start;">Verdict emitted at datapath | No userspace latency</text>
  <text x="460" y="358" class="label-small" style="text-anchor: start;">High-performance | Loss-tolerant | Non-blocking</text>

  <!-- WHY CILIUM REPLACES TCPDUMP -->
  <text x="500" y="750" class="label-bold" style="font-size: 16px;">The Single Source of Network Truth</text>

</svg>
