<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .gateway-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 6; }
      .cilium-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .arrow { stroke: #37474f; stroke-width: 2.0; marker-end: url(#arrow-head); fill: none; }
      .label-bold { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 12px; text-anchor: middle; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" />
  
  <text x="300" y="40" class="label-bold" style="font-size: 18px;">Unified Ingress &amp; Routing (Gateway API)</text>

  <rect x="250" y="80" width="100" height="50" class="box" />
  <text x="300" y="110" class="label-bold">External User</text>

  <line x1="300" y1="130" x2="300" y2="180" class="arrow" />

  <rect x="200" y="180" width="200" height="60" class="gateway-box" />
  <text x="300" y="215" class="label-bold" fill="#1565c0">Kubernetes Gateway</text>

  <line x1="250" y1="240" x2="180" y2="300" class="arrow" />
  <line x1="350" y1="240" x2="420" y2="300" class="arrow" />

  <rect x="80" y="300" width="180" height="60" class="cilium-box" />
  <text x="170" y="335" class="label-bold" fill="#2e7d32">Cilium eBPF/Envoy</text>
  <text x="170" y="380" class="label-reg">Route: /api/v1</text>

  <rect x="340" y="300" width="180" height="60" class="cilium-box" />
  <text x="430" y="335" class="label-bold" fill="#2e7d32">Cilium eBPF/Envoy</text>
  <text x="430" y="380" class="label-reg">Route: /api/v2</text>

</svg>
