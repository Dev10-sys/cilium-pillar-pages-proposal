<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Regions */
      .enterprise-box { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.5; rx: 8; }
      .cluster-box { fill: #fcfcfc; stroke: #90a4ae; stroke-width: 1.5; rx: 12; }
      
      /* Components */
      .node-box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; rx: 4; }
      .router-box { fill: #ffffff; stroke: #37474f; stroke-width: 2.0; rx: 4; }
      .agent-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 4; }
      .pod-box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 2; }
      .gateway-node { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      
      /* Arrows */
      .arrow-green { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-orange { stroke: #ef6c00; stroke-width: 2; stroke-dasharray: 4 2; fill: none; marker-end: url(#arrow-head-orange); }
      .arrow-internal { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      
      /* Boundaries */
      .firewall-line { stroke: #c62828; stroke-width: 3; stroke-dasharray: 8 4; }
      
      /* Text Styles */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-sub { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
      
      /* Info Boxes */
      .info-box { fill: #fafafa; stroke: #cfd8dc; rx: 4; }
    </style>
    
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef6c00" />
    </marker>
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Cilium External Networking: BGP &amp; Egress Gateway Integration</text>

  <!-- TOP LAYER: ENTERPRISE NETWORK -->
  <rect x="50" y="80" width="900" height="200" class="enterprise-box" />
  <text x="70" y="105" class="label-bold" style="text-anchor: start;">Enterprise Network</text>

  <rect x="400" y="110" width="200" height="60" class="router-box" />
  <text x="500" y="145" class="label-bold">Core Router / ToR Switch</text>

  <line x1="100" y1="180" x2="900" y2="180" class="firewall-line" />
  <text x="500" y="195" class="label-bold" fill="#c62828">Legacy Firewall</text>

  <rect x="700" y="110" width="180" height="50" class="info-box" />
  <text x="790" y="140" class="label-reg">External Systems (DB / Internet)</text>


  <!-- MIDDLE LAYER: KUBERNETES CLUSTER -->
  <rect x="50" y="320" width="900" height="400" class="cluster-box" />
  <text x="70" y="340" class="label-bold" style="text-anchor: start;">Kubernetes Cluster</text>

  <!-- Node 1 -->
  <rect x="80" y="360" width="250" height="150" class="node-box" />
  <text x="100" y="375" class="label-small">Node 1</text>
  <rect x="145" y="385" width="120" height="40" class="agent-box" />
  <text x="205" y="410" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  <text x="205" y="423" class="label-small" style="fill:#0d47a1;">(BGP Peer)</text>
  <rect x="145" y="440" width="120" height="40" class="pod-box" />
  <text x="205" y="465" class="label-reg">Pod A</text>

  <!-- Node 2 -->
  <rect x="375" y="360" width="250" height="150" class="node-box" />
  <text x="395" y="375" class="label-small">Node 2</text>
  <rect x="440" y="385" width="120" height="40" class="agent-box" />
  <text x="500" y="410" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  <text x="500" y="423" class="label-small" style="fill:#0d47a1;">(BGP Peer)</text>
  <rect x="440" y="440" width="120" height="40" class="pod-box" />
  <text x="500" y="465" class="label-reg">Pod B</text>

  <!-- Egress Gateway Node -->
  <rect x="670" y="360" width="250" height="150" class="gateway-node" />
  <text x="690" y="375" class="label-small">Egress Gateway Node</text>
  <rect x="735" y="385" width="120" height="40" class="agent-box" />
  <text x="795" y="410" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  <rect x="735" y="440" width="120" height="40" fill="#fff" stroke="#2e7d32" stroke-width="2" rx="4" />
  <text x="795" y="465" class="label-bold" fill="#1b5e20">Static Egress IP</text>


  <!-- BGP CONTROL PLANE -->
  <path d="M205 385 L400 140" class="arrow-orange" />
  <path d="M500 385 L500 170" class="arrow-orange" />
  <text x="340" y="250" class="label-bold" fill="#e65100" transform="rotate(-52 340 250)">BGP Advertisement</text>
  <text x="340" y="270" class="label-small" fill="#e65100" transform="rotate(-52 340 270)">Pod CIDRs | Service IPs | ECMP</text>


  <!-- INGRESS TRAFFIC FLOW (Direct Routing) -->
  <path d="M70 140 L400 140" class="arrow-green" />
  <path d="M500 170 L500 385" class="arrow-green" />
  <text x="235" y="130" class="label-bold" fill="#1b5e20">External Client</text>
  <text x="510" y="300" class="label-reg" fill="#1b5e20" font-weight="600">Direct Routing (No NAT)</text>


  <!-- EGRESS GATEWAY FLOW -->
  <path d="M205 480 L205 600 L795 600 L795 510" class="arrow-internal" /> <!-- Pod A to Gateway Node -->
  <text x="500" y="590" class="label-small">Internal Route (eBPF)</text>
  
  <path d="M795 385 L795 180" class="arrow-green" />
  <text x="805" y="250" class="label-reg" fill="#1b5e20" font-weight="600">Source IP = Static Egress IP</text>


  <!-- EGRESS USE CASE BOX -->
  <rect x="670" y="530" width="250" height="150" class="info-box" />
  <text x="795" y="555" class="label-bold">Why Egress Gateway Exists</text>
  <text x="685" y="580" class="label-reg" style="text-anchor: start;">• Enterprise Firewall allowlists</text>
  <text x="685" y="600" class="label-reg" style="text-anchor: start;">• Clean audit logging at boundary</text>
  <text x="685" y="620" class="label-reg" style="text-anchor: start;">• Regulatory compliance</text>
  <text x="685" y="640" class="label-reg" style="text-anchor: start;">• Deterministic source IP per app</text>


  <!-- SECURITY & FAILURE CONTEXT -->
  <rect x="80" y="530" width="250" height="150" class="info-box" />
  <text x="205" y="555" class="label-bold">Identity-Based Policy</text>
  <text x="95" y="580" class="label-reg" style="text-anchor: start;">• Identity preserved internally</text>
  <text x="95" y="600" class="label-reg" style="text-anchor: start;">• Policy-based routing via eBPF</text>
  <text x="95" y="620" class="label-reg" style="text-anchor: start;">• Clear audit trail across clusters</text>

  <rect x="375" y="530" width="250" height="150" class="info-box" />
  <text x="500" y="555" class="label-bold">Failure Handling</text>
  <text x="390" y="580" class="label-reg" style="text-anchor: start;">• BGP withdraw on node failure</text>
  <text x="390" y="600" class="label-reg" style="text-anchor: start;">• Router triggers ECMP failover</text>
  <text x="390" y="620" class="label-reg" style="text-anchor: start;">• Automatic path convergence</text>


  <!-- FOOTER QUOTE -->
  <text x="500" y="860" class="label-bold" style="font-size: 16px;">Kubernetes as a First-Class Citizen of the Physical Network</text>

</svg>
