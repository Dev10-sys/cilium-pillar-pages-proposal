<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      .cluster-bg { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 8; }
      .node-bg { fill: #ffffff; stroke: #b0bec5; stroke-width: 1.5; rx: 6; }
      
      /* Colors */
      .agent-box { fill: #e8f5e9; stroke: #66bb6a; stroke-width: 1.5; rx: 6; }
      .pod-box { fill: #e3f2fd; stroke: #42a5f5; stroke-width: 1.5; rx: 6; }
      .sync-box { fill: #ffe0b2; stroke: #ffa726; stroke-width: 1.5; rx: 16; }
      
      /* Typography */
      .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .subtitle { font-size: 14px; font-weight: 600; fill: #546e7a; text-anchor: middle; }
      .label { font-size: 12px; font-weight: 400; text-anchor: middle; }
      .label-bold { font-size: 12px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 11px; fill: #546e7a; text-anchor: middle; }

      /* Connections */
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
      .arrow-dashed { stroke: #37474f; stroke-width: 1.5; stroke-dasharray: 6 3; marker-end: url(#arrow-head); marker-start: url(#arrow-tail); }
      .tunnel-arrow { stroke: #1565c0; stroke-width: 2.5; marker-end: url(#arrow-head-blue); }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-tail" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="title">Cilium Cluster Mesh Architecture</text>

  <!-- Cluster A (Left) -->
  <rect x="50" y="80" width="300" height="350" class="cluster-bg" />
  <text x="200" y="110" class="subtitle">Cluster A</text>

  <!-- Node A -->
  <rect x="80" y="130" width="240" height="270" class="node-bg" />
  <text x="110" y="155" class="label" fill="#90a4ae" style="font-size: 11px;">NODE</text>

  <!-- Cilium Agent A -->
  <rect x="140" y="170" width="120" height="50" class="agent-box" />
  <text x="200" y="200" class="label-bold">Cilium Agent</text>

  <!-- Pod A -->
  <rect x="140" y="300" width="120" height="50" class="pod-box" />
  <text x="200" y="325" class="label-bold">Frontend Pod</text>
  <text x="200" y="340" class="small">10.0.1.5</text>


  <!-- Cluster B (Right) -->
  <rect x="450" y="80" width="300" height="350" class="cluster-bg" />
  <text x="600" y="110" class="subtitle">Cluster B</text>

  <!-- Node B -->
  <rect x="480" y="130" width="240" height="270" class="node-bg" />
  <text x="510" y="155" class="label" fill="#90a4ae" style="font-size: 11px;">NODE</text>

  <!-- Cilium Agent B -->
  <rect x="540" y="170" width="120" height="50" class="agent-box" />
  <text x="600" y="200" class="label-bold">Cilium Agent</text>

  <!-- Pod B -->
  <rect x="540" y="300" width="120" height="50" class="pod-box" />
  <text x="600" y="325" class="label-bold">Backend Pod</text>
  <text x="600" y="340" class="small">10.0.2.9</text>


  <!-- CENTER SYNC COMPONENT -->
  <rect x="300" y="180" width="200" height="30" class="sync-box" />
  <text x="400" y="200" class="label-bold">Identity &amp; Service Sync</text>

  <!-- Sync Connections (Dashed) -->
  <line x1="260" y1="195" x2="300" y2="195" class="arrow-dashed" />
  <line x1="540" y1="195" x2="500" y2="195" class="arrow-dashed" />


  <!-- DATA PATH TUNNEL -->
  <line x1="260" y1="325" x2="540" y2="325" class="tunnel-arrow" />
  
  <!-- Tunnel Label -->
  <rect x="320" y="315" width="160" height="20" fill="white" opacity="0.9" rx="4" />
  <text x="400" y="330" class="label-bold" fill="#1565c0">Direct Tunnel</text>
  <text x="400" y="345" class="small" fill="#1565c0">(VXLAN / Geneve)</text>

</svg>
