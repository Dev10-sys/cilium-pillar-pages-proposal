<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Regions */
      .node-boundary { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 12; }
      
      /* Containers */
      .pod-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .ebpf-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .envoy-box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2.0; rx: 6; }
      .agent-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 4; }
      
      /* Arrows */
      .path-arrow { fill: none; stroke: #37474f; stroke-width: 2.0; marker-end: url(#arrow-head); }
      .slow-path-arrow { fill: none; stroke: #ef6c00; stroke-width: 2.0; stroke-dasharray: 4 2; marker-end: url(#arrow-head-orange); }
      .control-arrow { fill: none; stroke: #1565c0; stroke-width: 1.5; stroke-dasharray: 4 4; marker-end: url(#arrow-head-blue); }
      
      /* Text */
      .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; font-weight: 400; text-anchor: middle; }
      .annotation { font-size: 12px; font-weight: 600; fill: #546e7a; font-style: italic; }
      .path-label { font-size: 12px; font-weight: 600; }
    </style>
    
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef6c00" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="400" y="40" class="title">Sidecar-less Service Mesh: Fast Path vs Slow Path</text>

  <!-- Node Boundary -->
  <rect x="50" y="70" width="700" height="480" class="node-boundary" />
  <text x="70" y="95" class="label-bold" style="text-anchor: start;">Kubernetes Node</text>

  <!-- TOP LAYER: PODS -->
  <rect x="150" y="110" width="120" height="60" class="pod-box" />
  <text x="210" y="135" class="label-bold">Pod: frontend</text>

  <rect x="530" y="110" width="120" height="60" class="pod-box" />
  <text x="590" y="135" class="label-bold">Pod: backend</text>

  <!-- Initial Application Traffic -->
  <path d="M210 170 L210 240" class="path-arrow" />
  <text x="220" y="210" class="path-label" style="text-anchor: start;">Application traffic</text>

  <!-- MIDDLE LAYER: eBPF DATAPATH (FAST PATH) -->
  <rect x="100" y="240" width="600" height="100" class="ebpf-box" />
  <text x="400" y="265" class="label-bold" fill="#1b5e20" style="font-size: 14px;">eBPF Datapath (Kernel)</text>
  <text x="400" y="290" class="label-reg" fill="#1b5e20">• Identity-based policy</text>
  <text x="400" y="305" class="label-reg" fill="#1b5e20">• L3/L4 enforcement</text>
  <text x="400" y="320" class="label-reg" fill="#1b5e20">• Service load balancing</text>

  <!-- Fast Path continue -->
  <path d="M590 240 L590 170" class="path-arrow" />
  <text x="400" y="230" class="path-label" fill="#2e7d32" style="text-anchor: middle;">Fast Path (no proxy, line-rate)</text>
  
  <path d="M210 290 L590 290" class="path-arrow" />

  <!-- SLOW PATH BRANCH -->
  <path d="M350 340 L350 410" class="slow-path-arrow" />
  <text x="360" y="375" class="path-label" fill="#e65100" style="text-anchor: start;">L7 policy match</text>
  
  <path d="M450 410 L450 340" class="slow-path-arrow" />

  <!-- BOTTOM LAYER: ENVOY -->
  <rect x="250" y="410" width="300" height="90" class="envoy-box" />
  <text x="400" y="435" class="label-bold" fill="#bf360c">Envoy (Node-local, managed by Cilium)</text>
  <text x="400" y="455" class="label-reg" fill="#bf360c">• HTTP parsing / Path filtering</text>
  <text x="400" y="470" class="label-reg" fill="#bf360c">• gRPC awareness</text>
  <text x="400" y="485" class="label-reg" fill="#bf360c">• Retries / Mirroring</text>

  <text x="400" y="525" class="path-label" fill="#e65100" style="text-anchor: middle;">Slow Path (only when required)</text>

  <!-- CONTROL PLANE -->
  <rect x="660" y="380" width="120" height="60" class="agent-box" />
  <text x="720" y="415" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  
  <path d="M720 380 L700 340" class="control-arrow" />
  <path d="M660 415 L550 435" class="control-arrow" />
  <text x="720" y="455" class="label-reg" fill="#1565c0" style="font-weight: 600;">Policy &amp; config</text>

  <!-- ANNOTATIONS -->
  <text x="60" y="140" class="annotation" style="text-anchor: start;">"No per-Pod sidecars"</text>
  <text x="740" y="140" class="annotation" style="text-anchor: end;">"No app restarts on mesh enable"</text>
  <text x="400" y="570" class="annotation" style="text-anchor: middle; font-size: 13px;">"Kernel fast path preserved for most traffic"</text>

</svg>
