<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Panels & Containers */
      .panel-border { fill: #fafafa; stroke: #cfd8dc; stroke-width: 1; rx: 8; }
      .node-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      
      /* iptables styles (Red) */
      .iptables-rule { fill: #ffebee; stroke: #c62828; stroke-width: 1; rx: 2; }
      .iptables-text { fill: #c62828; font-size: 11px; font-weight: 600; text-anchor: middle; }
      
      /* Maglev styles (Green) */
      .maglev-table { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .pod-box { fill: #ffffff; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
      .maglev-text { fill: #1b5e20; font-size: 12px; font-weight: 600; text-anchor: middle; }
      
      /* Arrows */
      .arrow-line { fill: none; stroke: #37474f; stroke-width: 2.0; marker-end: url(#arrow-head); }
      .arrow-red { fill: none; stroke: #c62828; stroke-width: 1.5; marker-end: url(#arrow-head-red); }
      .arrow-green { fill: none; stroke: #2e7d32; stroke-width: 2.0; marker-end: url(#arrow-head-green); }
      
      /* Text Styles */
      .title-main { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .panel-title { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-sub { font-size: 11px; fill: #546e7a; text-anchor: middle; }
      .annotation { font-size: 12px; font-weight: 600; fill: #455a64; font-style: italic; }
      .comp-header { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .comp-item { font-size: 12px; fill: #37474f; text-anchor: middle; }
    </style>
    
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="450" y="40" class="title-main">Service Load Balancing at Scale: iptables vs Maglev (Cilium)</text>

  <!-- LEFT PANEL: IPTABLES -->
  <rect x="50" y="80" width="375" height="480" class="panel-border" />
  <text x="237" y="110" class="panel-title" fill="#c62828">iptables-based Load Balancing</text>
  
  <rect x="80" y="130" width="315" height="380" class="node-box" />
  <text x="237" y="150" class="label-sub">Kubernetes Node</text>

  <!-- Rule Stack -->
  <rect x="160" y="180" width="155" height="25" class="iptables-rule" />
  <text x="237" y="197" class="iptables-text">Rule 1</text>
  
  <rect x="160" y="210" width="155" height="25" class="iptables-rule" />
  <text x="237" y="227" class="iptables-text">Rule 2</text>
  
  <rect x="160" y="240" width="155" height="25" class="iptables-rule" />
  <text x="237" y="257" class="iptables-text">Rule 3</text>
  
  <text x="237" y="285" class="iptables-text">...</text>
  
  <rect x="160" y="300" width="155" height="25" class="iptables-rule" />
  <text x="237" y="317" class="iptables-text">Rule N</text>

  <!-- Packets Flow Left -->
  <path d="M237 155 L237 175" class="arrow-red" />
  <path d="M237 205 L237 210" class="arrow-red" />
  <path d="M237 235 L237 240" class="arrow-red" />
  <path d="M237 325 L237 380" class="arrow-red" />
  
  <text x="237" y="165" class="comp-item" style="font-weight: 600;">Incoming Service Packet</text>
  <text x="325" y="250" class="annotation" style="text-anchor: start;">O(N) rule traversal</text>

  <!-- Backend Pod Left -->
  <rect x="160" y="380" width="155" height="50" fill="white" stroke="#455a64" rx="4" />
  <text x="237" y="410" class="comp-item" style="font-weight: 600;">Backend Pod</text>

  <text x="237" y="470" class="comp-item">• CPU-heavy</text>
  <text x="237" y="485" class="comp-item">• Slow updates</text>
  <text x="237" y="500" class="comp-item">• Breaks at scale</text>


  <!-- RIGHT PANEL: CILIUM MAGLEV -->
  <rect x="475" y="80" width="375" height="480" class="panel-border" />
  <text x="662" y="110" class="panel-title" fill="#2e7d32">Cilium eBPF + Maglev</text>

  <rect x="505" y="130" width="315" height="380" class="node-box" />
  <text x="662" y="150" class="label-sub">Kubernetes Node</text>

  <!-- Maglev Map -->
  <path d="M600 200 L725 200 L740 230 L725 260 L600 260 L585 230 Z" class="maglev-table" />
  <text x="662" y="225" class="maglev-text">Maglev Lookup Table</text>
  <text x="662" y="243" class="label-sub" style="fill:#1b5e20;">(eBPF Map)</text>

  <!-- Backend Pods Right -->
  <rect x="530" y="380" width="70" height="40" class="pod-box" />
  <text x="565" y="405" class="maglev-text" style="font-size: 10px;">Pod A</text>
  
  <rect x="627" y="380" width="70" height="40" class="pod-box" />
  <text x="662" y="405" class="maglev-text" style="font-size: 10px;">Pod B</text>
  
  <rect x="725" y="380" width="70" height="40" class="pod-box" />
  <text x="760" y="405" class="maglev-text" style="font-size: 10px;">Pod C</text>

  <!-- Packets Flow Right -->
  <path d="M662 155 L662 200" class="arrow-green" />
  <path d="M662 260 L662 375" class="arrow-green" />
  
  <text x="662" y="165" class="comp-item" style="font-weight: 600;">Incoming Service Packet</text>
  <text x="745" y="235" class="annotation" style="text-anchor: start;">O(1) hash lookup</text>

  <!-- Explanation box -->
  <rect x="530" y="280" width="265" height="70" fill="#fff" stroke="#81c784" stroke-width="1" stroke-dasharray="4 2" rx="4" />
  <text x="662" y="300" class="maglev-text">Consistent Hashing</text>
  <text x="662" y="318" class="comp-item" style="font-size: 10px;">• Stable flow mapping</text>
  <text x="662" y="333" class="comp-item" style="font-size: 10px;">• Minimal remapping on scale</text>

  <!-- BOTTOM COMPARISON -->
  <rect x="50" y="580" width="800" height="100" class="panel-border" />
  
  <text x="237" y="605" class="comp-header" fill="#c62828">iptables</text>
  <text x="237" y="625" class="comp-item">Linear scan</text>
  <text x="237" y="640" class="comp-item">Rule explosion</text>
  <text x="237" y="655" class="comp-item">Conntrack-intensive</text>
  
  <text x="662" y="605" class="comp-header" fill="#2e7d32">Maglev (eBPF)</text>
  <text x="662" y="625" class="comp-item">Constant time</text>
  <text x="662" y="640" class="comp-item">Kernel-native lookup</text>
  <text x="662" y="655" class="comp-item">Scales to 10k+ services</text>
  
  <line x1="450" y1="590" x2="450" y2="670" stroke="#cfd8dc" stroke-width="1" />

  <!-- LATENCY ANNOTATIONS -->
  <text x="50" y="300" class="annotation" transform="rotate(-90 50 300)" style="text-anchor: middle;">Latency increases with service count &gt;</text>
  <text x="850" y="300" class="annotation" transform="rotate(90 850 300)" style="text-anchor: middle;">&lt; Latency remains constant</text>
  
  <text x="450" y="570" class="annotation" style="text-anchor: middle; font-weight: bold;">"Why Cilium replaces kube-proxy"</text>

</svg>
