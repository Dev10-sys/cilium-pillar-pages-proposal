<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .bg { fill: #ffffff; }
      
      /* Panels */
      .panel-border { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; rx: 8; }
      .kernel-box { fill: #f5f5f5; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      
      /* Components */
      .ebpf-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 4; }
      .identity-box { fill: #fff9c4; stroke: #fbc02d; stroke-width: 1.5; rx: 4; }
      .control-box { fill: #fafafa; stroke: #90a4ae; stroke-width: 1.5; rx: 4; }
      .pod-box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 2; }
      
      /* Arrows */
      .arrow-green { stroke: #2e7d32; stroke-width: 2.5; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-red { stroke: #c62828; stroke-width: 2.5; fill: none; marker-end: url(#arrow-head-red); }
      .arrow-std { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      .arrow-dash { stroke: #37474f; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; marker-end: url(#arrow-head-dark); }
      
      /* Decision Diamond */
      .diamond { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }
      
      /* Text Styles */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-panel { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
      .annotation { font-size: 12px; font-weight: 600; fill: #455a64; font-style: italic; }
    </style>
    
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Cilium Network Security: Identity-Based Policy Enforcement</text>

  <!-- LEFT PANEL: KUBERNETES CONTROL PLANE -->
  <rect x="50" y="80" width="300" height="200" class="control-box" />
  <text x="200" y="105" class="title-panel">Kubernetes Control Plane</text>
  
  <text x="70" y="130" class="label-reg" style="text-anchor: start; font-weight: 600;">Pod Labels:</text>
  <text x="80" y="145" class="mono" style="text-anchor: start;">app=frontend</text>
  <text x="80" y="160" class="mono" style="text-anchor: start;">role=backend</text>
  
  <text x="70" y="190" class="label-reg" style="text-anchor: start; font-weight: 600;">NetworkPolicy:</text>
  <text x="80" y="205" class="mono" style="text-anchor: start;">allow frontend → backend</text>
  <text x="80" y="220" class="mono" style="text-anchor: start;">TCP Port 80</text>

  <!-- IDENTITY MAPPING -->
  <rect x="400" y="80" width="550" height="110" class="identity-box" />
  <text x="675" y="105" class="title-panel" fill="#f57f17">Identity Mapping</text>
  <text x="420" y="135" class="mono" style="text-anchor: start;">app=frontend → Identity 1001</text>
  <text x="420" y="155" class="mono" style="text-anchor: start;">role=backend  → Identity 2001</text>
  <text x="675" y="180" class="annotation">"Identity is stable across Pod restarts and IP changes"</text>

  <path d="M350 140 L400 140" class="arrow-std" />

  <!-- KERNEL ENFORCEMENT -->
  <rect x="50" y="320" width="900" height="420" class="kernel-box" />
  <text x="500" y="345" class="title-panel">Linux Kernel — eBPF Datapath</text>

  <!-- eBPF logic components -->
  <rect x="100" y="370" width="200" height="40" class="ebpf-box" />
  <text x="200" y="395" class="label-bold" fill="#0d47a1">XDP / TC Hook</text>

  <rect x="350" y="370" width="200" height="60" class="ebpf-box" />
  <text x="450" y="395" class="label-bold" fill="#0d47a1">Identity Resolution</text>
  <text x="450" y="415" class="label-small" style="fill:#0d47a1;">IP → ID Mapping</text>

  <path d="M300 390 L350 390" class="arrow-std" />

  <!-- Policy Map Details -->
  <rect x="670" y="370" width="250" height="100" class="ebpf-box" stroke-dasharray="4 2" />
  <text x="795" y="395" class="label-bold" fill="#0d47a1">eBPF Policy Map (Hash)</text>
  <text x="685" y="420" class="mono" style="text-anchor: start;">Key: SrcID + DstID + L4</text>
  <text x="685" y="440" class="mono" style="text-anchor: start;">Value: ALLOW / DENY</text>
  <text x="795" y="460" class="label-small" style="fill:#094ba1; font-weight:bold;">O(1) Lookup - Scale Safe</text>

  <!-- Decision Point -->
  <polygon points="500,450 580,500 500,550 420,500" class="diamond" />
  <text x="500" y="505" class="label-bold" fill="#0d47a1">Policy Lookup</text>

  <path d="M450 430 L450 470" class="arrow-std" />
  <path d="M670 420 L585 490" class="arrow-dash" />

  <!-- Verdicts -->
  <path d="M580 500 L800 500 L800 580" class="arrow-green" />
  <text x="780" y="520" class="label-bold" fill="#2e7d32" style="text-anchor: start;">ALLOW</text>
  
  <path d="M420 500 L200 500 L200 580" class="arrow-red" />
  <text x="220" y="520" class="label-bold" fill="#c62828" style="text-anchor: end;">DENY</text>


  <!-- PACKET FLOW VISUALS -->
  <!-- Top Pods -->
  <rect x="120" y="590" width="160" height="60" class="pod-box" />
  <text x="200" y="620" class="label-bold">Frontend Pod</text>
  <text x="200" y="640" class="label-small">ID: 1001</text>

  <rect x="420" y="590" width="160" height="60" class="pod-box" />
  <text x="500" y="620" class="label-bold">Backend Pod</text>
  <text x="500" y="640" class="label-small">ID: 2001</text>
  
  <rect x="720" y="590" width="160" height="60" class="pod-box" stroke="#c62828" stroke-dasharray="2 1" />
  <text x="800" y="620" class="label-bold" fill="#c62828">Database Pod</text>
  <text x="800" y="640" class="label-small">Unknown ID</text>

  <!-- Flow Arrows -->
  <path d="M200 650 L200 700 L500 700 L500 650" class="arrow-green" />
  <text x="350" y="690" class="label-reg" fill="#2e7d32" font-weight="600">Allowed Flow (Labeled Identity)</text>

  <path d="M120 620 L30 620 L30 780 L800 780 L800 650" class="arrow-red" />
  <text x="415" y="770" class="label-reg" fill="#c62828" font-weight="600">Denied Flow (No policy Match - Implicit DROP)</text>


  <!-- KEY SECURITY PROPERTIES -->
  <rect x="50" y="760" width="900" height="110" class="control-box" />
  <rect x="70" y="780" width="200" height="70" fill="#fff" stroke="#cfd8dc" rx="4" />
  <text x="170" y="805" class="label-bold">Zero Trust</text>
  <text x="170" y="825" class="label-reg">Default Deny</text>
  <text x="170" y="840" class="label-reg">Strict Identity</text>

  <rect x="300" y="780" width="300" height="70" fill="#fff" stroke="#cfd8dc" rx="4" />
  <text x="450" y="805" class="label-bold">Operational Safety</text>
  <text x="450" y="825" class="label-reg">No iptables chains overhead</text>
  <text x="450" y="840" class="label-reg">State preserved during Agent restart</text>

  <rect x="630" y="780" width="300" height="70" fill="#fff" stroke="#cfd8dc" rx="4" />
  <text x="780" y="805" class="label-bold">Efficiency</text>
  <text x="780" y="825" class="label-reg">O(1) Map Lookups</text>
  <text x="780" y="840" class="label-reg">Kernel-level enforcement</text>

</svg>
