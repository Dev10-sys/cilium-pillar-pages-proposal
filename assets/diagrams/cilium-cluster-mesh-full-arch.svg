<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Clusters */
      .cluster-box { fill: #fafafa; stroke: #90a4ae; stroke-width: 1.5; rx: 12; }
      .cluster-label { font-size: 16px; font-weight: 600; text-anchor: middle; }
      
      /* Components */
      .comp-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .agent-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 4; }
      .node-box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; rx: 4; }
      .pod-box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 2; }
      
      /* Arrows */
      .arrow-sync { stroke: #ef6c00; stroke-width: 2; fill: none; marker-end: url(#arrow-head-orange); }
      .arrow-data { stroke: #2e7d32; stroke-width: 2.5; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-internal { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      
      /* Text */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
      
      /* Regions */
      .info-box { fill: #f5f5f5; stroke: #cfd8dc; rx: 4; }
      .global-svc-box { fill: #fafafa; stroke: #2e7d32; stroke-dasharray: 4 2; rx: 4; }
    </style>

    <marker id="arrow-head-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef6c00" />
    </marker>
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Cilium Cluster Mesh: Identity-Based Multi-Cluster Networking</text>

  <!-- CLUSTER A -->
  <rect x="50" y="80" width="400" height="500" class="cluster-box" />
  <text x="250" y="110" class="cluster-label">Cluster A</text>

  <rect x="100" y="130" width="120" height="40" class="comp-box" />
  <text x="160" y="155" class="label-bold">Kubernetes API</text>

  <rect x="280" y="130" width="120" height="40" class="agent-box" />
  <text x="340" y="155" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  <text x="340" y="170" class="label-small" style="fill:#0d47a1;">(DaemonSet)</text>

  <rect x="80" y="220" width="340" height="340" class="node-box" />
  <text x="100" y="240" class="label-small">Node A_1</text>

  <rect x="120" y="270" width="260" height="100" class="pod-box" />
  <text x="250" y="295" class="label-bold">Frontend Pod</text>
  <text x="250" y="315" class="label-small">Identity: 101 (labels)</text>

  <rect x="120" y="400" width="260" height="100" class="pod-box" />
  <text x="250" y="425" class="label-bold">Backend Pod (Local)</text>


  <!-- CLUSTER B -->
  <rect x="550" y="80" width="400" height="500" class="cluster-box" />
  <text x="750" y="110" class="cluster-label">Cluster B</text>

  <rect x="600" y="130" width="120" height="40" class="comp-box" />
  <text x="660" y="155" class="label-bold">Kubernetes API</text>

  <rect x="780" y="130" width="120" height="40" class="agent-box" />
  <text x="840" y="155" class="label-bold" fill="#0d47a1">Cilium Agent</text>
  <text x="840" y="170" class="label-small" style="fill:#0d47a1;">(DaemonSet)</text>

  <rect x="580" y="220" width="340" height="340" class="node-box" />
  <text x="600" y="240" class="label-small">Node B_1</text>

  <rect x="620" y="270" width="260" height="100" class="pod-box" />
  <text x="750" y="295" class="label-bold">Backend Pod (Remote)</text>
  <text x="750" y="315" class="label-small">Identity: 202 (labels)</text>

  <rect x="620" y="400" width="260" height="100" class="pod-box" />
  <text x="750" y="425" class="label-bold">Database Pod</text>


  <!-- CONTROL PLANE SYNC (TOP) -->
  <path d="M400 150 L600 150" class="arrow-sync" />
  <path d="M600 150 L400 150" class="arrow-sync" marker-end="none"/> <!-- Just line -->
  <text x="500" y="140" class="label-bold" fill="#e65100">Identity + Service Sync</text>
  <text x="500" y="170" class="label-small" fill="#e65100">• No shared etcd | Loose coupling | Eventually consistent</text>


  <!-- DATA PLANE (CENTER) -->
  <path d="M250 370 L250 385 L750 385 L750 370" class="arrow-data" />
  <text x="500" y="405" class="label-bold" fill="#1b5e20">eBPF Direct Tunnel (VXLAN / Geneve)</text>
  <text x="500" y="420" class="label-small" fill="#1b5e20">• Client-side load balancing | No central gateway | No hairpinning</text>


  <!-- GLOBAL SERVICE LOGIC -->
  <rect x="400" y="200" width="200" height="60" class="global-svc-box" />
  <text x="500" y="225" class="label-bold" fill="#1b5e20">Global Service (backend)</text>
  <text x="500" y="240" class="label-small" fill="#1b5e20">• Local preference | Remote failover</text>


  <!-- SECURITY & OBSERVABILITY (BOTTOM) -->
  <rect x="50" y="600" width="440" height="150" class="info-box" />
  <text x="270" y="625" class="label-bold">Identity-Based Policy (Shared)</text>
  <text x="70" y="650" class="label-reg" style="text-anchor: start;">• Same labels → same identity across clusters</text>
  <text x="70" y="670" class="label-reg" style="text-anchor: start;">• Network policies work transparently cross-cluster</text>
  <text x="70" y="690" class="label-reg" style="text-anchor: start;">• No dependency on Pod CIDR allowlists</text>
  
  <text x="270" y="730" class="label-small" font-style="italic">Hubble: frontend.cluster-a → backend.cluster-b (ALLOWED)</text>


  <!-- ANNOTATION BOX — WHY THIS SCALES -->
  <rect x="510" y="600" width="440" height="150" class="info-box" />
  <text x="730" y="625" class="label-bold">Why This Scales</text>
  <text x="530" y="650" class="label-reg" style="text-anchor: start;">• No central bottleneck: Scaling cluster-to-cluster</text>
  <text x="530" y="670" class="label-reg" style="text-anchor: start;">• No gateway SPOF: High availability built-in</text>
  <text x="530" y="690" class="label-reg" style="text-anchor: start;">• Decoupled logic: Failure in one cluster stays isolated</text>
  <text x="530" y="710" class="label-reg" style="text-anchor: start;">• Native Performance: Direct node-to-node routing</text>

</svg>
