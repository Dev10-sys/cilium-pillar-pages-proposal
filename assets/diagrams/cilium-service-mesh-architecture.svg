<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; text-anchor: middle; alignment-baseline: middle; }
      .bg { fill: #ffffff; }
      
      .box { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.5; rx: 6; }
      .app-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 1.5; rx: 4; }
      .sidecar-box { fill: #ffebee; stroke: #e57373; stroke-width: 1.5; rx: 4; }
      .kernel-box { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; rx: 8; }
      
      .arrow { stroke: #37474f; stroke-width: 1.5; marker-end: url(#arrow-head); }
      .arrow-dashed { stroke: #999; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-head); }
      
      .label-title { font-size: 16px; font-weight: 600; fill: #546e7a; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 11px; fill: #546e7a; }
      .highlight-red { font-size: 11px; font-weight: 600; fill: #d32f2f; }
      .highlight-green { font-size: 11px; font-weight: 600; fill: #2e7d32; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" font-size="18" font-weight="bold">Service Mesh: Sidecar vs Cilium Sidecar-Free</text>

  <!-- Left: Sidecar Model -->
  <g transform="translate(0,60)">
    <text x="200" y="30" class="label-title">Traditional Sidecar Model</text>
    
    <!-- Pod A -->
    <rect x="100" y="80" width="200" height="100" class="box" />
    <text x="200" y="95" class="small">Pod A</text>
    
    <rect x="120" y="110" width="60" height="40" class="app-box" />
    <text x="150" y="130" class="label">App</text>
    
    <rect x="220" y="110" width="60" height="40" class="sidecar-box" />
    <text x="250" y="130" class="label" fill="#c62828">Sidecar</text>
    
    <line x1="180" y1="130" x2="220" y2="130" class="arrow" />

    <!-- Pod B -->
    <rect x="100" y="300" width="200" height="100" class="box" />
    <text x="200" y="315" class="small">Pod B</text>
    
    <rect x="120" y="340" width="60" height="40" class="app-box" />
    <text x="150" y="360" class="label">App</text>
    
    <rect x="220" y="340" width="60" height="40" class="sidecar-box" />
    <text x="250" y="360" class="label" fill="#c62828">Sidecar</text>
    
    <line x1="220" y1="360" x2="180" y2="360" class="arrow" />

    <!-- Network -->
    <line x1="250" y1="150" x2="250" y2="340" class="arrow" />
    
    <!-- Annotation -->
    <text x="290" y="240" class="highlight-red" text-anchor="start">Extra Hops</text>
    <text x="290" y="255" class="small" text-anchor="start">(Proxy-to-Proxy)</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="400" y1="80" x2="400" y2="450" stroke="#eceff1" stroke-width="2" />

  <!-- Right: Cilium Model -->
  <g transform="translate(400,60)">
    <text x="200" y="30" class="label-title">Cilium Sidecar-Free</text>
    
    <!-- Pod A -->
    <rect x="100" y="80" width="100" height="80" class="box" />
    <text x="150" y="95" class="small">Pod A</text>
    <rect x="120" y="110" width="60" height="40" class="app-box" />
    <text x="150" y="130" class="label">App</text>

    <!-- Pod B -->
    <rect x="250" y="80" width="100" height="80" class="box" />
    <text x="300" y="95" class="small">Pod B</text>
    <rect x="270" y="110" width="60" height="40" class="app-box" />
    <text x="300" y="130" class="label">App</text>

    <!-- Kernel Layer -->
    <rect x="80" y="220" width="290" height="60" class="kernel-box" />
    <text x="225" y="250" class="label" fill="#2e7d32">KERNEL (eBPF DATAPATH)</text>

    <!-- Path -->
    <line x1="150" y1="160" x2="150" y2="220" class="arrow" />
    <path d="M150 250 L300 250" stroke="none" fill="none" /> <!-- invisible helper -->
    <line x1="300" y1="220" x2="300" y2="160" class="arrow" />

    <!-- Optional Envoy -->
    <rect x="175" y="350" width="100" height="40" fill="#fff3e0" stroke="#ef6c00" rx="4" />
    <text x="225" y="370" class="label" fill="#e65100">Per-Node Envoy</text>
    <text x="225" y="385" class="small" fill="#e65100">(L7 Traffic Only)</text>
    
    <!-- L7 Redirect -->
    <path d="M225 280 L225 350" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow-head)" />
    
    <!-- Annotation -->
    <text x="225" y="200" class="highlight-green">Direct L3/L4 Path</text>
    <text x="225" y="310" class="small" fill="#ef6c00" text-anchor="start">Optional L7 Redirect</text>
  </g>

</svg>
