<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #263238; }
      .bg { fill: #ffffff; }
      
      .box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .start-box { fill: #eceff1; stroke: #78909c; stroke-width: 1.5; rx: 4; }
      .kernel-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
      .hubble-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; rx: 4; }
      .decision-box { fill: #fffde7; stroke: #fbc02d; stroke-width: 1.5; }
      
      .arrow { stroke: #455a64; stroke-width: 1.5; marker-end: url(#arrow-head); fill: none; }
      .arrow-drop { stroke: #c62828; stroke-width: 1.5; marker-end: url(#arrow-head-red); fill: none; }
      .arrow-obs { stroke: #1976d2; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-head-blue); fill: none; }
      
      .label-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .label-sub { font-size: 11px; fill: #546e7a; text-anchor: middle; }
      .footer { font-size: 12px; fill: #546e7a; font-style: italic; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="label-title">Cilium Policy Enforcement Flow (Packet → Verdict)</text>

  <!-- 1. Packet Entry -->
  <rect x="50" y="100" width="160" height="60" class="start-box" />
  <text x="130" y="125" class="label">Packet Arrives</text>
  <text x="130" y="145" class="label-sub">From Pod / External</text>

  <line x1="130" y1="160" x2="130" y2="200" class="arrow" />

  <!-- 2. Source Identity -->
  <rect x="50" y="200" width="160" height="60" class="kernel-box" />
  <text x="130" y="225" class="label">Src Identity</text>
  <text x="130" y="245" class="label-sub">IP → Identity Lookup</text>

  <line x1="210" y1="230" x2="260" y2="230" class="arrow" />

  <!-- 3. Dest Identity -->
  <rect x="260" y="200" width="160" height="60" class="kernel-box" />
  <text x="340" y="225" class="label">Dst Identity</text>
  <text x="340" y="245" class="label-sub">Svc / Pod Identity</text>

  <line x1="420" y1="230" x2="470" y2="230" class="arrow" />

  <!-- 4. Decision Diamond -->
  <polygon points="470,230 530,190 590,230 530,270" class="decision-box" />
  <text x="530" y="235" class="label" style="font-size: 12px;">Policy Check</text>

  <!-- Allowed Path (Right) -->
  <line x1="590" y1="230" x2="640" y2="230" class="arrow" />
  <text x="615" y="220" class="label-sub" fill="#2e7d32">Matched</text>

  <!-- 5. L4 Validation -->
  <rect x="640" y="200" width="120" height="60" class="kernel-box" />
  <text x="700" y="225" class="label">L4 Check</text>
  <text x="700" y="245" class="label-sub">Port / Proto</text>

  <line x1="700" y1="260" x2="700" y2="300" class="arrow" />

  <!-- 6. Forward Packet -->
  <rect x="640" y="300" width="120" height="60" class="kernel-box" />
  <text x="700" y="325" class="label">Forward</text>
  <text x="700" y="345" class="label-sub">To Dest Pod</text>


  <!-- Denied Path (Down) -->
  <line x1="530" y1="270" x2="530" y2="320" class="arrow-drop" />
  <text x="540" y="300" class="label-sub" fill="#c62828">No Match</text>

  <!-- 7. Drop Packet -->
  <rect x="470" y="320" width="120" height="60" class="kernel-box" style="stroke: #c62828; fill: #ffebee;" />
  <text x="530" y="345" class="label" fill="#c62828">DROP</text>
  <text x="530" y="365" class="label-sub" fill="#c62828">Immediate Kernel Drop</text>


  <!-- OBSERVABILITY -->
  <line x1="700" y1="360" x2="700" y2="400" class="arrow-obs" />
  <line x1="530" y1="380" x2="530" y2="430" class="arrow-obs" />
  <!-- Let's connect the Drop box to Hubble too -->
  <path d="M530 380 L530 430 L640 430" class="arrow-obs" style="marker-end: none;" />
  <line x1="700" y1="400" x2="700" y2="430" class="arrow-obs" style="marker-end: none;" />
  
  <rect x="640" y="400" width="120" height="60" class="hubble-box" />
  <text x="700" y="425" class="label" fill="#1565c0">Hubble Event</text>
  <text x="700" y="445" class="label-sub">Verdict + Reason</text>

  <!-- Footer Notes -->
  <text x="50" y="480" class="footer">Policy evaluation is O(1) hash lookup</text>
  <text x="600" y="480" class="footer" text-anchor="end">No IP-based rule traversal</text>

</svg>
