<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #263238; }
      .bg { fill: #ffffff; }
      
      .box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .control-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 4; }
      .identity-box { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 4; }
      .kernel-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 4; }
      .cache-box { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.5; rx: 4; }
      
      .arrow { stroke: #455a64; stroke-width: 1.5; marker-end: url(#arrow-head); fill: none; }
      .arrow-dashed { stroke: #455a64; stroke-width: 1.5; stroke-dasharray: 4 2; marker-end: url(#arrow-head); fill: none; }
      
      .label-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label-section { font-size: 14px; font-weight: bold; fill: #546e7a; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .label-sub { font-size: 12px; fill: #546e7a; text-anchor: middle; }
      .annotation { font-size: 11px; fill: #546e7a; font-style: italic; text-anchor: end; }
    </style>
    <marker id="arrow-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="label-title">Cilium Identity Resolution Flow</text>

  <!-- SECTION LABELS -->
  <text x="150" y="70" class="label-section">KUBERNETES CONTROL PLANE</text>
  <text x="400" y="70" class="label-section">CILIUM CONTROL PLANE</text>
  <text x="650" y="70" class="label-section">KERNEL DATAPATH</text>

  <!-- SEPARATORS -->
  <line x1="270" y1="80" x2="270" y2="450" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="530" y1="80" x2="530" y2="450" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 4" />

  <!-- LEFT: K8s -->
  <rect x="50" y="150" width="200" height="60" class="control-box" />
  <text x="150" y="175" class="label">Kubernetes API</text>
  <text x="150" y="195" class="label-sub">Pod Created</text>
  
  <rect x="70" y="240" width="160" height="50" class="box" />
  <text x="150" y="260" class="label-sub">Labels:</text>
  <text x="150" y="275" class="label-sub">app=frontend, env=prod</text>

  <line x1="150" y1="210" x2="150" y2="240" class="arrow" />
  <line x1="230" y1="265" x2="300" y2="265" class="arrow" />

  <!-- MIDDLE: Cilium Agent -->
  <rect x="300" y="150" width="200" height="60" class="control-box" />
  <text x="400" y="175" class="label">Cilium Agent</text>
  <text x="400" y="195" class="label-sub">Watches Pod Events</text>

  <line x1="400" y1="210" x2="400" y2="240" class="arrow" />

  <!-- Identity Allocation -->
  <rect x="300" y="240" width="200" height="60" class="identity-box" />
  <text x="400" y="265" class="label" fill="#4a148c">Identity Allocation</text>
  <text x="400" y="285" class="label-sub">Deterministic Hash</text>

  <line x1="400" y1="300" x2="400" y2="330" class="arrow" />

  <!-- Numeric Identity -->
  <rect x="320" y="330" width="160" height="50" class="identity-box" />
  <text x="400" y="355" class="label" fill="#4a148c">ID: 1532</text>
  <text x="400" y="370" class="label-sub">Cluster-wide Unique</text>

  <!-- Side Cache -->
  <line x1="480" y1="355" x2="520" y2="355" class="arrow-dashed" />
  <rect x="520" y="330" width="100" height="50" class="cache-box" transform="translate(-160, 80)" /> <!-- Adjust position manually -->
  <!-- Actually let's put it below to avoid clutter -->
  
  <line x1="400" y1="380" x2="400" y2="410" class="arrow-dashed" />
  <rect x="320" y="410" width="160" height="40" class="cache-box" />
  <text x="400" y="430" class="label-sub" fill="#e65100">KV Store / Identity Cache</text>

  <!-- Connection to Datapath -->
  <line x1="500" y1="180" x2="560" y2="180" class="arrow" />


  <!-- RIGHT: Datapath -->
  <rect x="560" y="150" width="200" height="60" class="kernel-box" />
  <text x="660" y="175" class="label">Endpoint Created</text>
  <text x="660" y="195" class="label-sub">Pod IP ↔ Identity Map</text>

  <line x1="660" y1="210" x2="660" y2="240" class="arrow" />

  <rect x="560" y="240" width="200" height="60" class="kernel-box" />
  <text x="660" y="265" class="label">eBPF Map Lookup</text>
  <text x="660" y="285" class="label-sub">IP → ID Resolution</text>

  <line x1="660" y1="300" x2="660" y2="330" class="arrow" />

  <rect x="560" y="330" width="200" height="60" class="kernel-box" />
  <text x="660" y="355" class="label">Policy Enforcement</text>
  <text x="660" y="375" class="label-sub">Allow ID A → ID B?</text>

  <!-- Footer Annotation -->
  <text x="780" y="480" class="annotation">IP addresses may change. Identity does not.</text>

</svg>
