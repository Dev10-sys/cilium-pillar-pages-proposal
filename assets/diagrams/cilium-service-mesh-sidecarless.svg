<svg width="1000" height="750" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Panels & Nodes */
      .panel-bg { fill: #fafafa; stroke: #cfd8dc; stroke-width: 1; rx: 8; }
      .node-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      
      /* Containers */
      .pod-box { fill: #ffffff; stroke: #455a64; stroke-width: 1; rx: 4; }
      .app-box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.5; rx: 2; }
      .proxy-box { fill: #ffebee; stroke: #c62828; stroke-width: 1.5; rx: 2; }
      .ebpf-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .envoy-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2.0; rx: 6; }
      
      /* Arrows */
      .arrow-red { stroke: #c62828; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-red); }
      .arrow-green { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-blue { stroke: #1565c0; stroke-width: 2; fill: none; marker-end: url(#arrow-head-blue); }
      .arrow-internal { stroke: #37474f; stroke-width: 1.5; fill: none; marker-end: url(#arrow-head-dark); }
      
      /* Text Styles */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-panel { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .label-small { font-size: 10px; fill: #546e7a; text-anchor: middle; }
      .annotation-red { fill: #c62828; font-size: 12px; font-weight: 600; }
      .annotation-green { fill: #1b5e20; font-size: 12px; font-weight: 600; }
      .footer-header { font-size: 14px; font-weight: 600; text-anchor: middle; }
    </style>
    
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
    <marker id="arrow-head-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Service Mesh Architecture: Sidecar vs Sidecar-Free (Cilium)</text>

  <!-- LEFT PANEL: TRADITIONAL -->
  <rect x="50" y="80" width="440" height="520" class="panel-bg" />
  <text x="270" y="110" class="title-panel" fill="#c62828">Traditional Service Mesh (Sidecar per Pod)</text>
  
  <rect x="80" y="130" width="380" height="400" class="node-box" />
  <text x="270" y="150" class="label-small">Kubernetes Node</text>

  <!-- Left Pod A -->
  <rect x="100" y="170" width="160" height="100" stroke="#cfd8dc" fill="#fff" rx="4" />
  <text x="180" y="185" class="label-bold" style="font-size: 11px;">Pod A</text>
  <rect x="110" y="195" width="140" height="30" class="app-box" />
  <text x="180" y="215" class="label-reg">App Container</text>
  <rect x="110" y="230" width="140" height="30" class="proxy-box" />
  <text x="180" y="250" class="label-bold" fill="#c62828">Sidecar Proxy (Envoy)</text>

  <!-- Left Pod B -->
  <rect x="100" y="300" width="160" height="100" stroke="#cfd8dc" fill="#fff" rx="4" />
  <text x="180" y="315" class="label-bold" style="font-size: 11px;">Pod B</text>
  <rect x="110" y="325" width="140" height="30" class="app-box" />
  <text x="180" y="345" class="label-reg">App Container</text>
  <rect x="110" y="360" width="140" height="30" class="proxy-box" />
  <text x="180" y="380" class="label-bold" fill="#c62828">Sidecar Proxy (Envoy)</text>

  <!-- Left arrows -->
  <path d="M180 225 L180 230" class="arrow-internal" /> <!-- App to Sidecar A -->
  <path d="M250 245 L300 245 L300 375 L250 375" class="arrow-red" /> <!-- Sidecar to Sidecar -->
  <text x="310" y="310" class="annotation-red" style="text-anchor: start;">"Every pod pays the cost"</text>

  <!-- Left Annotations -->
  <text x="80" y="440" class="annotation-red" style="text-anchor: start;">• One proxy per pod</text>
  <text x="80" y="455" class="annotation-red" style="text-anchor: start;">• High memory usage</text>
  <text x="80" y="470" class="annotation-red" style="text-anchor: start;">• Startup race conditions</text>
  <text x="250" y="440" class="annotation-red" style="text-anchor: start;">• Complex upgrades</text>
  <text x="250" y="455" class="annotation-red" style="text-anchor: start;">• Debugging overhead</text>


  <!-- RIGHT PANEL: CILIUM -->
  <rect x="510" y="80" width="440" height="520" class="panel-bg" />
  <text x="730" y="110" class="title-panel" fill="#2e7d32">Cilium Sidecar-Free Service Mesh</text>
  
  <rect x="540" y="130" width="380" height="400" class="node-box" />
  <text x="730" y="150" class="label-small">Kubernetes Node</text>

  <!-- Right Pods -->
  <rect x="560" y="170" width="130" height="60" class="pod-box" />
  <text x="625" y="205" class="label-bold">App Pod (Frontend)</text>
  
  <rect x="790" y="170" width="130" height="60" class="pod-box" />
  <text x="855" y="205" class="label-bold">App Pod (Backend)</text>

  <text x="730" y="165" class="annotation-green" style="text-anchor: middle;">No sidecars inside pods</text>

  <!-- Kernel Layer -->
  <rect x="560" y="280" width="340" height="70" class="ebpf-box" />
  <text x="730" y="305" class="label-bold" fill="#1b5e20">Linux Kernel (eBPF Datapath)</text>
  <text x="730" y="325" class="label-small" style="fill:#1b5e20; font-weight: 600;">Identity Enforcement | Policy | Load Balancing</text>

  <!-- Standard Path Arrows -->
  <path d="M625 230 L625 280" class="arrow-green" />
  <path d="M855 280 L855 230" class="arrow-green" />
  <path d="M625 315 L855 315" class="arrow-green" />
  <text x="730" y="270" class="label-reg" fill="#1b5e20" font-weight="600">Fast Path (L3/L4)</text>

  <!-- Optional L7 Path -->
  <rect x="630" y="390" width="200" height="50" class="envoy-box" />
  <text x="730" y="415" class="label-bold" fill="#0d47a1">Node-local Envoy (Shared)</text>
  <text x="730" y="433" class="label-small" style="fill:#01579b;">Only for L7 (HTTP, gRPC)</text>

  <path d="M730 350 L730 390" class="arrow-blue" />
  <path d="M750 390 L750 350" class="arrow-blue" />

  <!-- Right Annotations -->
  <text x="560" y="470" class="annotation-green" style="text-anchor: start;">• L3/L4 handled in kernel</text>
  <text x="560" y="485" class="annotation-green" style="text-anchor: start;">• Identity-based policy</text>
  <text x="750" y="470" class="annotation-green" style="text-anchor: start;">• Near-zero overhead</text>
  <text x="750" y="485" class="annotation-green" style="text-anchor: start;">• No pod mutation</text>


  <!-- ANNOTATION BOX (SIDE) -->
  <rect x="50" y="610" width="220" height="120" stroke="#cfd8dc" fill="#fafafa" rx="4" />
  <text x="160" y="635" class="footer-header">Why Sidecar-Free Matters</text>
  <text x="65" y="655" class="label-reg" style="text-anchor: start;">• No per-pod proxy tax</text>
  <text x="65" y="670" class="label-reg" style="text-anchor: start;">• Faster pod startup</text>
  <text x="65" y="685" class="label-reg" style="text-anchor: start;">• Simpler operations</text>
  <text x="65" y="700" class="label-reg" style="text-anchor: start;">• Easier upgrades</text>
  <text x="65" y="715" class="label-reg" style="text-anchor: start;">• Kernel-level enforcement</text>

  <!-- COMPARISON STRIP -->
  <rect x="300" y="610" width="650" height="120" stroke="#cfd8dc" fill="#fafafa" rx="4" />
  <line x1="625" y1="620" x2="625" y2="720" stroke="#cfd8dc" stroke-width="1" />
  
  <text x="462" y="635" class="footer-header" fill="#c62828">Sidecar Mesh</text>
  <text x="462" y="665" class="label-reg">One proxy per pod; High memory duplication</text>
  <text x="462" y="685" class="label-reg">Complex lifecycle management (Webhooks)</text>
  <text x="462" y="705" class="label-reg">High latency due to multiple userspace hops</text>

  <text x="787" y="635" class="footer-header" fill="#2e7d32">Cilium Sidecar-Free</text>
  <text x="787" y="665" class="label-reg">Kernel-first; eBPF handles 90% of traffic</text>
  <text x="787" y="685" class="label-reg">Unchanged application pods; Zero-touch mesh</text>
  <text x="787" y="705" class="label-reg">Shared per-node proxy only for L7 parsing</text>

</svg>
