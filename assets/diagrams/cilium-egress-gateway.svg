<svg width="1000" height="750" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
      text { font-family: 'Inter', sans-serif, system-ui; fill: #263238; }
      .bg { fill: #ffffff; }
      
      /* Regions */
      .cluster-box { fill: #fcfcfc; stroke: #cfd8dc; stroke-width: 1.5; rx: 8; }
      .external-box { fill: #f5f5f5; stroke: #9e9e9e; stroke-width: 1.5; rx: 8; }
      
      /* Components */
      .pod-box { fill: #ffffff; stroke: #455a64; stroke-width: 1.5; rx: 4; }
      .gateway-node { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2.0; rx: 6; }
      .firewall-box { fill: #ffffff; stroke: #37474f; stroke-width: 2.0; rx: 4; }
      
      /* Arrows */
      .arrow-red { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#arrow-head-red); }
      .arrow-green { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#arrow-head-green); }
      .arrow-internal { stroke: #1565c0; stroke-width: 1.5; stroke-dasharray: 4 2; fill: none; marker-end: url(#arrow-head-blue); }
      
      /* Text */
      .title-main { font-size: 22px; font-weight: 600; text-anchor: middle; }
      .title-sub { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .label-bold { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .label-reg { font-size: 11px; text-anchor: middle; }
      .warning-text { fill: #c62828; font-size: 12px; font-weight: 600; }
      .success-text { fill: #1b5e20; font-size: 12px; font-weight: 600; }
      .tag { fill: #ffffff; stroke: #2e7d32; rx: 2; }
      .annotation-box { fill: #fafafa; stroke: #cfd8dc; rx: 4; }
    </style>
    
    <marker id="arrow-head-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
    </marker>
    <marker id="arrow-head-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrow-head-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <text x="500" y="40" class="title-main">Outbound Traffic Control: Kubernetes vs Cilium Egress Gateway</text>

  <!-- LEFT HALF: DEFAULT K8S -->
  <text x="250" y="80" class="title-sub" fill="#c62828">Default Kubernetes Egress (SNAT)</text>
  <rect x="50" y="100" width="400" height="250" class="cluster-box" />
  <text x="70" y="120" class="label-bold" style="text-anchor: start;">Kubernetes Cluster</text>

  <!-- Pods Left -->
  <rect x="100" y="140" width="100" height="40" class="pod-box" />
  <text x="150" y="165" class="label-reg">payments-pod</text>
  
  <rect x="230" y="140" width="100" height="40" class="pod-box" />
  <text x="280" y="165" class="label-reg">orders-pod</text>
  
  <rect x="165" y="200" width="100" height="40" class="pod-box" />
  <text x="215" y="225" class="label-reg">auth-pod</text>

  <!-- Arrows Left -->
  <path d="M150 180 L100 280" class="arrow-red" />
  <path d="M280 180 L350 280" class="arrow-red" />
  <path d="M215 240 L220 280" class="arrow-red" />

  <!-- Node IPs -->
  <text x="100" y="300" class="label-reg">Node IP 1</text>
  <text x="220" y="300" class="label-reg">Node IP 2</text>
  <text x="350" y="300" class="label-reg">Node IP 3</text>

  <!-- Firewall Left -->
  <rect x="100" y="450" width="300" height="100" class="firewall-box" />
  <text x="250" y="480" class="label-bold">Enterprise Firewall</text>
  <text x="110" y="505" class="warning-text">• Dynamic source IPs</text>
  <text x="110" y="520" class="warning-text">• Firewall allowlist breaks</text>
  <text x="255" y="505" class="warning-text">• Compliance pain</text>
  <text x="255" y="520" class="warning-text">• Impossible auditing</text>

  <path d="M100 310 L150 450" class="arrow-red" />
  <path d="M220 310 L250 450" class="arrow-red" />
  <path d="M350 310 L350 450" class="arrow-red" />


  <!-- RIGHT HALF: CILIUM -->
  <text x="750" y="80" class="title-sub" fill="#2e7d32">Cilium Egress Gateway</text>
  <rect x="550" y="100" width="400" height="250" class="cluster-box" />
  <text x="570" y="120" class="label-bold" style="text-anchor: start;">Kubernetes Cluster</text>

  <!-- Namespace & Pods -->
  <rect x="580" y="130" width="160" height="120" fill="none" stroke="#cfd8dc" stroke-dasharray="4 2" rx="4" />
  <text x="660" y="145" class="label-reg" font-weight="600">payments namespace</text>
  
  <rect x="590" y="160" width="60" height="30" class="pod-box" />
  <rect x="670" y="160" width="60" height="30" class="pod-box" />
  <rect x="630" y="200" width="60" height="30" class="pod-box" />

  <!-- Internal Routing -->
  <path d="M660 250 L800 280" class="arrow-internal" />
  <text x="730" y="260" class="label-reg" fill="#1565c0" transform="rotate(12 730 260)">Internal reroute</text>

  <!-- Gateway Node -->
  <rect x="750" y="280" width="150" height="60" class="gateway-node" />
  <text x="825" y="305" class="label-bold" fill="#1b5e20">Egress Gateway Node</text>
  <rect x="765" y="315" width="120" height="20" class="tag" />
  <text x="825" y="330" class="label-reg" fill="#2e7d32" font-weight="bold">Static Egress IP: 10.20.1.5</text>

  <!-- External Path -->
  <path d="M825 340 L800 450" class="arrow-green" />

  <!-- Firewall Right -->
  <rect x="650" y="450" width="300" height="100" class="firewall-box" />
  <text x="800" y="480" class="label-bold">Enterprise Firewall</text>
  <text x="660" y="505" class="success-text">• Single predictable IP</text>
  <text x="660" y="520" class="success-text">• Easy allowlisting</text>
  <text x="810" y="505" class="success-text">• Clean audit logs</text>
  <text x="810" y="520" class="success-text">• Compliance-friendly</text>


  <!-- ANNOTATION BOX -->
  <rect x="50" y="580" width="220" height="130" class="annotation-box" />
  <text x="160" y="605" class="label-bold">Why Egress Gateway exists</text>
  <text x="65" y="630" class="label-reg" style="text-anchor: start;">• Pods are ephemeral</text>
  <text x="65" y="650" class="label-reg" style="text-anchor: start;">• Firewalls expect stable IPs</text>
  <text x="65" y="670" class="label-reg" style="text-anchor: start;">• NAT hides identity</text>
  <text x="65" y="690" class="label-reg" style="text-anchor: start;">• Compliance determinism</text>

  <!-- TECHNICAL DETAIL -->
  <text x="715" y="365" class="label-reg" font-weight="600">Policy-based routing via eBPF</text>
  <text x="715" y="380" class="label-reg">• Namespace-based selection</text>
  <text x="715" y="395" class="label-reg">• Identity-aware / No kube-proxy</text>


  <!-- COMPARISON STRIP -->
  <rect x="300" y="580" width="650" height="130" class="annotation-box" />
  <line x1="625" y1="590" x2="625" y2="700" stroke="#cfd8dc" stroke-width="1" />
  
  <text x="462" y="610" class="label-bold" fill="#c62828">Default Kubernetes</text>
  <text x="462" y="640" class="label-reg">Random source node IP for every flow</text>
  <text x="462" y="665" class="label-reg">Hostile to IP-based enterprise firewalls</text>
  <text x="462" y="690" class="label-reg">Impossible to debug or audit flows per-app</text>

  <text x="787" y="610" class="label-bold" fill="#2e7d32">Cilium Egress Gateway</text>
  <text x="787" y="640" class="label-reg">Deterministic static IP per workload group</text>
  <text x="787" y="665" class="label-reg">Native L3 integration with physical network</text>
  <text x="787" y="690" class="label-reg">Identity preserved; Clean compliance audits</text>

</svg>
